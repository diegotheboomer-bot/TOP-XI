<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bands</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 11 Bands (no photos): each category is a soft earthy colour band; compact rows with the price on the right. */
:root { --paper: #faf8f4; --ink: #2d2a26; --soft: #6e675e; --line: rgba(45,42,38,.12); --display: "Fraunces", Georgia, serif; --body: "Figtree", system-ui, sans-serif; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
.pad { max-width: 640px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left)); padding-right: max(18px, env(safe-area-inset-right)); }
.head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding-top: max(18px, env(safe-area-inset-top)); padding-bottom: 18px; }
.logo { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; display: grid; place-items: center; background: #e9dfcf; font: 600 17px var(--display); }
.head h1 { margin: 0; font: 600 26px/1.1 var(--display); }
.head p { margin: 2px 0 0; font-size: 13px; color: var(--soft); }
.head .open { color: #4f7a52; font-weight: 600; }
.lang { min-width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 50%; background: #fff; font: 600 12px var(--body); cursor: pointer; }
.bar { position: sticky; top: 0; z-index: 5; background: rgba(250,248,244,.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.row { display: flex; overflow-x: auto; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.secs { gap: 22px; padding-top: 10px; }
.secs button { flex: none; padding: 4px 0 8px; border: 0; border-bottom: 2px solid transparent; background: none; font: 600 15px var(--body); color: var(--soft); cursor: pointer; }
.secs button[aria-current="true"] { color: var(--ink); border-color: var(--ink); }
.cats { gap: 6px; padding: 8px 0 10px; }
.cats:empty { display: none; }
.cats button { flex: none; padding: 5px 12px; border: 0; border-radius: 999px; background: var(--c); font: 500 13px var(--body); color: var(--ink); cursor: pointer; opacity: .7; }
.cats button[aria-current="true"] { opacity: 1; box-shadow: inset 0 0 0 1.5px var(--ink); }
.note { margin: 0; padding: 16px max(18px, env(safe-area-inset-left)); background: #efe7da; white-space: pre-line; font-size: 14px; }
.band { position: relative; overflow: hidden; background: var(--c); padding-block: 20px 12px; scroll-margin-top: 96px; }
.band::after { content: ""; position: absolute; right: -40px; top: -40px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.35); }
.band h2 { position: relative; display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; font: 600 26px/1.1 var(--display); }
.band h2 small { font: 500 12px var(--body); color: var(--soft); }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: baseline; width: 100%; padding: 11px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
.item .n { display: block; font-weight: 600; font-size: 15.5px; line-height: 1.3; }
.item .d { display: block; margin-top: 1px; font-size: 13px; color: var(--soft); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.item .t { margin-left: 6px; font-size: 11px; font-weight: 600; color: #4f7a52; }
.item .p { font: 600 16px var(--display); white-space: nowrap; font-variant-numeric: tabular-nums; }
footer { padding-block: 24px calc(30px + env(safe-area-inset-bottom)); text-align: center; color: var(--soft); font-size: 13.5px; }
footer b { display: block; font: 600 20px var(--display); color: var(--ink); }
footer a { color: var(--ink); font-weight: 600; }
#m-sheet { margin: auto auto 0; width: 100%; max-width: 560px; padding: 0 0 env(safe-area-inset-bottom); border: 0; border-radius: 24px 24px 0 0; background: var(--paper); color: var(--ink); }
#m-sheet::backdrop { background: rgba(45,42,38,.4); }
.m-body { padding: 54px 22px 28px; }
.m-name { margin: 0; font: 600 28px/1.1 var(--display); }
.m-desc { margin: 8px 0 0; color: var(--soft); }
.m-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
.m-price { font: 600 22px var(--display); }
.m-badge { padding: 2px 10px; border-radius: 999px; background: #e3ebdc; color: #4f7a52; font-size: 12px; font-weight: 600; }
.m-close { position: absolute; top: 12px; right: 12px; width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 50%; background: #fff; font-size: 20px; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../core.js"></script>
<script>
const { esc } = Menu;
const $app = document.getElementById("app");
const BANDS = ["#efe5d6", "#dde6d5", "#dbe4ec", "#f0dcd2", "#e8e3f0", "#f3ebcf"];
const band = (k) => BANDS[k % BANDS.length];
Menu.start({
  render() {
    const s = Menu.section, info = Menu.info, st = Menu.status(), cats = Menu.categories();
    document.title = info.name;
    $app.innerHTML = `
      <header class="pad head">${Menu.logo("logo")}<div><h1>${esc(info.name)}</h1><p><span class="${st.open ? "open" : ""}">${esc(st.text)}</span>${Menu.desc(s) ? ` · ${esc(Menu.desc(s))}` : ""}</p></div><button class="lang" data-lang-toggle data-lang-label></button></header>
      <i data-top></i>
      <div class="bar" data-sticky><div class="pad"><nav class="row secs">${Menu.sectionsNav()}</nav>
        <nav class="row cats">${cats.length > 1 ? cats.map((c, k) => `<button data-cat="${Menu.catId(c)}" style="--c:${band(k)}">${esc(Menu.title(c))}</button>`).join("") : ""}</nav></div></div>
      ${Menu.tx(s, "info") ? `<p class="note">${esc(Menu.tx(s, "info"))}</p>` : ""}
      ${cats.map((c, k) => `<section class="band" id="${Menu.catId(c)}" style="--c:${band(k)}"><div class="pad">
        <h2>${esc(Menu.title(c))}<small>${c.items.length}</small></h2>
        ${c.items.map((i) => `<button class="item" ${Menu.ref(i)}><span><span class="n">${esc(Menu.name(i))}${i.volume ? `<span class="t">${esc(i.volume)}</span>` : ""}${Menu.badges(i).map((b) => `<span class="t">${b.text}</span>`).join("")}</span>
          ${Menu.desc(i) ? `<span class="d">${esc(Menu.desc(i))}</span>` : ""}</span><span class="p">${Menu.price(i.price)}</span></button>`).join("")}</div></section>`).join("") || `<p class="note">${Menu.t.empty}</p>`}
      <footer class="pad"><b>${esc(info.name)}</b>${esc(info.address)}<br>${esc(info.phone)} · <a href="${info.maps}" target="_blank" rel="noopener">${Menu.t.map}</a></footer>`;
  },
  onItem(item) { Menu.sheet(Menu.detail({ ...item, img: null })); },
});
</script>
</body>
</html>
