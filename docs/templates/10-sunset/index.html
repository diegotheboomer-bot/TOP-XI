<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunset</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 10 Sunset: beach bar. Warm gradient header with a wave edge, sand background, soft rounded cards. */
:root { --sand: #fff8f1; --card: #ffffff; --ink: #3a2438; --soft: #8a7386; --line: #f1e3d6; --coral: #ff7a5c; --berry: #c8487e; --sea: #1fa6a9; --sun: #ffc35a; --display: "Lexend", "Helvetica Neue", Arial, sans-serif; --body: "Lexend", system-ui, sans-serif; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
body { margin: 0; background: var(--sand); color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
.pad { max-width: 680px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left)); padding-right: max(18px, env(safe-area-inset-right)); }
.sky { position: relative; overflow: hidden; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: 54px; background: linear-gradient(160deg, var(--sun) 0%, var(--coral) 50%, var(--berry) 100%); color: #fff; }
.sky .top { display: flex; justify-content: space-between; align-items: center; }
.sky .st { padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,.22); font: 700 13px var(--body); }
.sky .lang { min-width: 44px; height: 44px; border: 0; border-radius: 50%; background: #fff; color: var(--berry); font: 600 14px var(--display); cursor: pointer; }
.sky .pad { position: relative; z-index: 1; }
.sun { position: absolute; right: -34px; bottom: -40px; width: 210px; height: 210px; border-radius: 50%; object-fit: cover; border: 6px solid rgba(255,255,255,.55); box-shadow: 0 0 0 18px rgba(255,255,255,.14), 0 0 0 40px rgba(255,255,255,.08); }
.sky .top { position: relative; z-index: 2; }
.sky h1 { max-width: 62%; letter-spacing: -.03em; text-shadow: 0 2px 12px rgba(120,30,60,.35); margin: 18px 0 0; font: 600 clamp(42px, 12vw, 64px)/1 var(--display); }
.sky p { margin: 4px 0 0; font: 500 18px var(--display); opacity: .92; }
.wave { display: block; width: 100%; height: 28px; margin-top: -27px; }
.bar { position: sticky; top: 0; z-index: 5; background: var(--sand); padding: 6px 0 8px; border-bottom: 1px solid var(--line); }
.row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.secs button { flex: none; padding: 8px 16px; border: 0; border-radius: 999px; background: var(--card); box-shadow: 0 1px 3px rgba(58,36,56,.08); font: 600 15px var(--display); cursor: pointer; }
.secs button[aria-current="true"] { background: var(--sea); color: #fff; }
.cats { gap: 16px; margin-top: 6px; }
.cats:empty { display: none; }
.cats button { flex: none; padding: 4px 0; border: 0; border-bottom: 2px solid transparent; background: none; font: 700 13px var(--body); color: var(--soft); cursor: pointer; }
.cats button[aria-current="true"] { color: var(--berry); border-color: var(--coral); }
.note { margin: 18px 0 0; padding: 16px 18px; border-radius: 18px; background: #ffeede; white-space: pre-line; font-size: 14px; }
.cat { margin-top: 28px; }
.cat h2 { margin: 0 0 12px; font: 600 26px/1.1 var(--display); color: var(--berry); }
.list { display: grid; gap: 12px; }
.rail { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; margin: 0 calc(-1 * max(18px, env(safe-area-inset-left))); padding: 0 max(18px, env(safe-area-inset-left)) 6px; scroll-padding: 0 max(18px, env(safe-area-inset-left)); }
.rail::-webkit-scrollbar { display: none; }
.pick { position: relative; flex: none; width: 60%; max-width: 240px; aspect-ratio: 4/5; scroll-snap-align: start; padding: 0; border: 0; border-radius: 26px; overflow: hidden; background: var(--card); cursor: pointer; text-align: left; }
.pick img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pick::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(200,72,126,.85)); }
.pick span { position: absolute; z-index: 1; left: 14px; right: 14px; bottom: 14px; color: #fff; }
.pick b { display: block; font: 600 18px/1.15 var(--display); }
.pick em { display: inline-block; margin-top: 6px; padding: 3px 10px; border-radius: 999px; background: var(--sun); color: var(--ink); font: 600 14px var(--display); font-style: normal; }
.c { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 14px; align-items: center; padding: 10px; border: 0; border-radius: 20px; background: var(--card); box-shadow: 0 1px 3px rgba(58,36,56,.07); text-align: left; cursor: pointer; }
.c .ph { width: 88px; height: 88px; border-radius: 16px; object-fit: cover; background: linear-gradient(135deg, var(--sun), var(--coral)); display: grid; place-items: center; font: 600 30px var(--display); color: #fff; }
.c .n { display: block; font: 600 17px/1.2 var(--display); }
.c .d { display: block; margin-top: 2px; font-size: 13.5px; color: var(--soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.c .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
.c .p { font: 600 16px var(--display); color: var(--berry); font-variant-numeric: tabular-nums; }
.c .b { padding: 2px 8px; border-radius: 999px; background: #e1f4f4; color: #17807f; font: 700 10.5px var(--body); text-transform: uppercase; letter-spacing: .04em; }
.c .b.sold { background: #f6e4ec; color: var(--berry); }
.c.sold .ph { filter: grayscale(1); opacity: .6; }
footer { margin: 36px 0 0; padding: 22px 0 calc(28px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); text-align: center; display: grid; gap: 4px; color: var(--soft); font-size: 14px; }
footer b { font: 600 22px var(--display); color: var(--ink); }
footer a { color: var(--berry); font-weight: 800; }
#m-sheet { margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92vh; padding: 0 0 env(safe-area-inset-bottom); border: 0; border-radius: 26px 26px 0 0; background: var(--sand); color: var(--ink); }
#m-sheet::backdrop { background: rgba(58,36,56,.45); }
.m-photo { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; }
.m-body { padding: 16px 20px 26px; }
.m-name { margin: 0; font: 600 26px/1.1 var(--display); color: var(--berry); }
.m-desc { margin: 6px 0 0; color: var(--soft); }
.m-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.m-price { font: 600 22px var(--display); }
.m-badge { padding: 3px 9px; border-radius: 999px; background: #e1f4f4; color: #17807f; font: 700 11px var(--body); text-transform: uppercase; }
.m-close { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: #fff; color: var(--ink); font-size: 22px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
button:focus-visible { outline: 3px solid var(--sea); outline-offset: 3px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../core.js"></script>
<script>
const { esc } = Menu;
const $app = document.getElementById("app");
Menu.start({
  render() {
    const s = Menu.section, info = Menu.info, st = Menu.status();
    document.title = info.name;
    $app.innerHTML = `
      <header class="sky">${Menu.photos(s, 1).map((i) => `<img class="sun" src="${Menu.img(i.img)}" alt="">`).join("")}<div class="pad"><div class="top"><span class="st">${esc(st.text)}</span><button class="lang" data-lang-toggle data-lang-label></button></div>
        <h1>${esc(info.name)}</h1>${Menu.desc(s) ? `<p>${esc(Menu.desc(s))}</p>` : ""}</div></header>
      <svg class="wave" viewBox="0 0 400 28" preserveAspectRatio="none" aria-hidden="true"><path d="M0 14 C 70 0, 130 28, 200 14 S 330 0, 400 14 V28 H0 Z" fill="#fff8f1"/></svg>
      <i data-top></i>
      <div class="bar" data-sticky><div class="pad"><nav class="row secs">${Menu.sectionsNav()}</nav><nav class="row cats">${Menu.catsNav()}</nav></div></div>
      <main class="pad">
        ${Menu.tx(s, "info") ? `<p class="note">${esc(Menu.tx(s, "info"))}</p>` : ""}
        ${Menu.featured(s).length > 1 ? `<section class="cat"><h2>${Menu.t.recommended}</h2><div class="rail">${Menu.featured(s).map((i) => `<button class="pick" ${Menu.ref(i)}><img src="${Menu.img(i.img)}" alt="" loading="lazy"><span><b>${esc(Menu.name(i))}</b><em>${Menu.price(i.price)}</em></span></button>`).join("")}</div></section>` : ""}
        ${Menu.categories().map((c) => `<section class="cat" id="${Menu.catId(c)}"><h2>${esc(Menu.title(c))}</h2><div class="list">
          ${c.items.map((i) => `<button class="c${i.soldOut ? " sold" : ""}" ${Menu.ref(i)}>
            ${i.img ? `<img class="ph" src="${Menu.img(i.img)}" alt="" loading="lazy">` : `<span class="ph">${esc(Menu.name(i).charAt(0))}</span>`}
            <span><span class="n">${esc(Menu.name(i))}</span>${Menu.desc(i) ? `<span class="d">${esc(Menu.desc(i))}</span>` : ""}
              <span class="meta"><span class="p">${Menu.price(i.price)}</span>${i.volume ? `<span class="b">${esc(i.volume)}</span>` : ""}${Menu.badges(i).map((b) => `<span class="b ${b.cls}">${b.text}</span>`).join("")}</span></span></button>`).join("")}
        </div></section>`).join("") || `<p class="note">${Menu.t.empty}</p>`}
        <footer><b>${esc(info.name)}</b><span>${esc(info.address)}</span><span>${esc(info.phone)} · <a href="${info.maps}" target="_blank" rel="noopener">${Menu.t.map}</a></span></footer>
      </main>`;
  },
});
</script>
</body>
</html>
