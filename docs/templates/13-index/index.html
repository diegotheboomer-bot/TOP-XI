<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 13 Index (no photos): dark and fast. Every category is a panel that opens and closes, so the whole menu fits on one screen. */
:root { --bg: #0f1012; --card: #1a1b1f; --card-2: #23252a; --ink: #f1f2f4; --soft: #9a9ca3; --line: #2a2c31; --lime: #d4ff3a; --display: "Unbounded", "Arial Black", sans-serif; --body: "Inter Tight", system-ui, sans-serif; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
.pad { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
.head { padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: 18px; }
.idcard { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px; border-radius: 24px; background: var(--card); }
.logo { width: 60px; height: 60px; border-radius: 16px; object-fit: cover; display: grid; place-items: center; background: var(--lime); color: #111; font: 700 16px var(--display); }
.idcard h1 { margin: 0; font: 700 22px/1.1 var(--display); letter-spacing: -.02em; }
.idcard p { margin: 4px 0 0; font-size: 13px; color: var(--soft); }
.idcard .open { color: var(--lime); }
.lang { min-width: 42px; height: 42px; border: 1px solid var(--line); border-radius: 12px; background: var(--card-2); font: 700 12px var(--display); cursor: pointer; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.stats div { padding: 12px; border-radius: 18px; background: var(--card); }
.stats b { display: block; font: 700 22px var(--display); color: var(--lime); }
.stats span { font-size: 12px; color: var(--soft); }
.bar { position: sticky; top: 0; z-index: 5; background: rgba(15,16,18,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.secs { padding: 10px 0; }
.secs button { flex: none; padding: 9px 14px; border: 1px solid var(--line); border-radius: 12px; background: none; font: 500 13px var(--display); color: var(--soft); cursor: pointer; }
.secs button[aria-current="true"] { background: var(--lime); border-color: var(--lime); color: #111; }
.note { margin: 16px 0 0; padding: 16px; border-radius: 18px; background: var(--card); white-space: pre-line; color: var(--soft); }
.acc { display: grid; gap: 8px; margin-top: 16px; }
details { border-radius: 22px; background: var(--card); overflow: hidden; scroll-margin-top: 70px; }
summary { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 16px; cursor: pointer; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary i { font: 500 11px var(--display); font-style: normal; color: var(--soft); }
summary b { font: 700 17px/1.15 var(--display); letter-spacing: -.01em; }
summary span { padding: 3px 9px; border-radius: 999px; background: var(--card-2); font-size: 12px; color: var(--soft); }
summary::after { content: "+"; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--card-2); font: 500 18px var(--body); transition: transform .2s; }
details[open] summary::after { content: "−"; background: var(--lime); color: #111; }
details[open] summary b { color: var(--lime); }
.items { padding: 0 8px 8px; display: grid; gap: 6px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 12px 12px 12px 14px; border: 0; border-radius: 16px; background: var(--card-2); text-align: left; cursor: pointer; }
.item .n { display: block; font-weight: 600; font-size: 15px; line-height: 1.3; }
.item .d { display: block; margin-top: 2px; font-size: 12.5px; color: var(--soft); }
.item .tags { display: flex; gap: 6px; margin-top: 5px; }
.item .tags span { font: 500 10px var(--display); color: var(--lime); text-transform: uppercase; letter-spacing: .04em; }
.item .p { font: 700 14px var(--display); white-space: nowrap; }
.tools { display: flex; justify-content: flex-end; margin-top: 12px; }
.tools button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: none; font-size: 12.5px; color: var(--soft); cursor: pointer; }
footer { margin-top: 30px; padding-block: 22px calc(30px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); color: var(--soft); font-size: 13.5px; }
footer b { display: block; margin-bottom: 4px; font: 700 18px var(--display); color: var(--ink); }
footer a { color: var(--lime); }
#m-sheet { margin: auto auto 0; width: 100%; max-width: 560px; padding: 0 0 env(safe-area-inset-bottom); border: 0; border-radius: 26px 26px 0 0; background: var(--card); color: var(--ink); }
#m-sheet::backdrop { background: rgba(0,0,0,.65); }
.m-body { padding: 56px 22px 28px; }
.m-name { margin: 0; font: 700 26px/1.15 var(--display); letter-spacing: -.02em; }
.m-desc { margin: 10px 0 0; color: var(--soft); }
.m-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; align-items: center; }
.m-price { padding: 6px 14px; border-radius: 12px; background: var(--lime); color: #111; font: 700 16px var(--display); }
.m-badge { padding: 4px 10px; border-radius: 999px; background: var(--card-2); font-size: 12px; }
.m-close { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border: 0; border-radius: 12px; background: var(--card-2); color: var(--ink); font-size: 22px; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../core.js"></script>
<script>
const { esc } = Menu;
const $app = document.getElementById("app");
const L = () => Menu.lang === "pt" ? { cats: "categorias", dishes: "pratos", from: "a partir de", all: "Abrir tudo", none: "Fechar tudo" } : { cats: "categories", dishes: "dishes", from: "from", all: "Open all", none: "Close all" };
Menu.start({
  render() {
    const s = Menu.section, info = Menu.info, st = Menu.status(), cats = Menu.categories(), l = L();
    const items = cats.flatMap((c) => c.items), min = items.length ? Math.min(...items.map((i) => i.price)) : 0;
    document.title = info.name;
    $app.innerHTML = `
      <header class="pad head"><div class="idcard">${Menu.logo("logo")}<div><h1>${esc(info.name)}</h1><p><span class="${st.open ? "open" : ""}">${esc(st.text)}</span>${Menu.desc(s) ? ` · ${esc(Menu.desc(s))}` : ""}</p></div><button class="lang" data-lang-toggle data-lang-label></button></div>
        ${items.length ? `<div class="stats"><div><b>${cats.length}</b><span>${l.cats}</span></div><div><b>${items.length}</b><span>${l.dishes}</span></div><div><b>${Math.round(min)}€</b><span>${l.from}</span></div></div>` : ""}</header>
      <i data-top></i>
      <div class="bar" data-sticky><div class="pad"><nav class="row secs">${Menu.sectionsNav()}</nav></div></div>
      <main class="pad">
        ${Menu.tx(s, "info") ? `<p class="note">${esc(Menu.tx(s, "info"))}</p>` : ""}
        ${cats.length > 1 ? `<div class="tools"><button id="toggle-all">${l.all}</button></div>` : ""}
        <div class="acc">${cats.map((c, k) => `<details id="${Menu.catId(c)}"${k === 0 ? " open" : ""}><summary><i>${String(k + 1).padStart(2, "0")}</i><b>${esc(Menu.title(c))}</b><span>${c.items.length}</span></summary>
          <div class="items">${c.items.map((i) => `<button class="item" ${Menu.ref(i)}><span><span class="n">${esc(Menu.name(i))}</span>${Menu.desc(i) ? `<span class="d">${esc(Menu.desc(i))}</span>` : ""}
            ${Menu.badges(i).length || i.volume ? `<span class="tags">${i.volume ? `<span>${esc(i.volume)}</span>` : ""}${Menu.badges(i).map((b) => `<span>${b.text}</span>`).join("")}</span>` : ""}</span>
            <span class="p">${Menu.price(i.price)}</span></button>`).join("")}</div></details>`).join("")}</div>
        ${cats.length ? "" : `<p class="note">${Menu.t.empty}</p>`}
        <footer><b>${esc(info.name)}</b>${esc(info.address)}<br>${esc(info.phone)} · <a href="${info.maps}" target="_blank" rel="noopener">${Menu.t.map}</a></footer>
      </main>`;
    document.getElementById("toggle-all")?.addEventListener("click", (e) => {
      const all = [...document.querySelectorAll("details")], open = !all.every((d) => d.open);
      all.forEach((d) => (d.open = open));
      e.target.textContent = open ? L().none : L().all;
    });
  },
  onItem(item) { Menu.sheet(Menu.detail({ ...item, img: null })); },
});
</script>
</body>
</html>
