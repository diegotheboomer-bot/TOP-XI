<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* 03 Stories: one category per screen. Full photo on top, the category's dishes listed below; swipe up for the next category. */
:root { --bg: #000; --ink: #fff; --soft: rgba(255,255,255,.7); --line: rgba(255,255,255,.12); --accent: #ffd23f; --display: "Anton", Impact, sans-serif; --body: "Manrope", system-ui, sans-serif; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; overflow: hidden; }
.feed { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; }
.feed::-webkit-scrollbar { display: none; }
.slide { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; flex-direction: column; overflow: hidden; }
.photo { position: relative; flex: none; height: 42%; min-height: 220px; overflow: hidden; background: #161616; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,.25) 65%, #000 100%); }
.photo h2 { position: absolute; z-index: 1; left: max(18px, env(safe-area-inset-left)); right: max(18px, env(safe-area-inset-right)); bottom: 8px; margin: 0; font: 400 clamp(40px, 12vw, 58px)/.95 var(--display); text-transform: uppercase; }
.photo h2 small { display: block; margin-bottom: 6px; font: 800 12px var(--body); letter-spacing: .16em; color: var(--accent); }
.list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding: 6px max(18px, env(safe-area-inset-right)) calc(26px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); }
.list::-webkit-scrollbar { display: none; }
.dish { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 10px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
.dish.noimg { grid-template-columns: minmax(0, 1fr) auto; }
.dish img { width: 54px; height: 54px; border-radius: 14px; object-fit: cover; }
.dish .n { display: block; font-weight: 700; font-size: 15px; line-height: 1.25; }
.dish .d { display: block; font-size: 12.5px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dish .p { padding: 4px 10px; border-radius: 999px; background: var(--accent); color: #000; font-weight: 800; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.next { margin-top: 14px; font: 800 11px var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--soft); text-align: center; }
/* Intro: collage, name, and the list of categories. */
.intro { justify-content: flex-end; }
.mosaic { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; opacity: .3; }
.mosaic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.intro .cap { position: relative; z-index: 1; display: grid; gap: 10px; padding: 120px max(18px, env(safe-area-inset-right)) calc(26px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.85) 26%); }
.kicker { font: 800 12px var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.intro h1 { margin: 0; font: 400 clamp(56px, 17vw, 92px)/.9 var(--display); text-transform: uppercase; }
.intro h1 em { font-style: normal; color: var(--accent); }
.cats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.cats button { position: relative; height: 74px; padding: 0; border: 0; border-radius: 16px; overflow: hidden; background: #1b1b1b; text-align: left; cursor: pointer; }
.cats img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .55; }
.cats span { position: absolute; left: 12px; bottom: 9px; right: 10px; font: 800 14px/1.15 var(--body); text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.cats small { display: block; font-weight: 600; font-size: 11px; color: var(--soft); }
.note { white-space: pre-line; color: var(--soft); font-size: 14px; }
/* Top bar: language, sections, progress dots. */
.top { position: fixed; z-index: 10; top: 0; left: 0; right: 0; padding: max(10px, env(safe-area-inset-top)) 0 0; display: grid; gap: 8px; pointer-events: none; }
.top > * { pointer-events: auto; }
.secs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 0 max(14px, env(safe-area-inset-left)); }
.secs::-webkit-scrollbar { display: none; }
.secs button { flex: none; height: 34px; padding: 0 13px; border: 0; border-radius: 999px; background: rgba(0,0,0,.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font: 800 12px var(--body); cursor: pointer; }
.secs button[aria-current="true"] { background: #fff; color: #000; }
.secs .lang { background: var(--accent); color: #000; }
.dots { display: flex; gap: 4px; padding: 0 max(14px, env(safe-area-inset-left)); pointer-events: none; }
.dots i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.28); }
.dots i.on { background: #fff; }
#m-sheet { margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92vh; padding: 0 0 env(safe-area-inset-bottom); border: 0; border-radius: 24px 24px 0 0; background: #141414; color: #fff; }
#m-sheet::backdrop { background: rgba(0,0,0,.6); }
.m-photo { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; }
.m-body { padding: 16px 20px 24px; }
.m-name { margin: 0; font: 400 32px/1 var(--display); text-transform: uppercase; }
.m-desc { margin: 8px 0 0; color: var(--soft); }
.m-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
.m-price { padding: 5px 14px; border-radius: 999px; background: var(--accent); color: #000; font-weight: 800; }
.m-badge { padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.14); font-size: 11px; font-weight: 800; text-transform: uppercase; }
.m-close { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 22px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="top"><div class="secs" id="secs"></div><div class="dots" id="dots"></div></div>
<div class="feed" id="feed"></div>
<script src="../core.js"></script>
<script>
const { esc } = Menu;
const feed = document.getElementById("feed");
let observer;
const cover = (c, s) => c.items.find((i) => i.img) || Menu.photos(s, 1)[0];
Menu.start({
  render() {
    const s = Menu.section, info = Menu.info, st = Menu.status(), cats = Menu.categories();
    document.title = info.name;
    const [a, ...b] = info.name.split(" & ");
    document.getElementById("secs").innerHTML = `<button class="lang" data-lang-toggle data-lang-label></button>` + Menu.sectionsNav();
    feed.innerHTML = `
      <section class="slide intro"><div class="mosaic" aria-hidden="true">${Menu.photos(s, 9).map((i) => `<img src="${Menu.img(i.img)}" alt="">`).join("")}</div>
        <div class="cap"><span class="kicker">${esc(st.text)}</span>
          <h1>${b.length ? `${esc(a)} <em>&amp;</em> ${esc(b.join(" & "))}` : esc(info.name)}</h1>
          ${Menu.tx(s, "info") ? `<p class="note">${esc(Menu.tx(s, "info"))}</p>` : ""}
          ${cats.length ? `<div class="cats">${cats.map((c, k) => { const ph = cover(c, s); return `<button data-slide="${k + 1}">${ph ? `<img src="${Menu.img(ph.img)}" alt="">` : ""}<span>${esc(Menu.title(c))}<small>${c.items.length}</small></span></button>`; }).join("")}</div>` : `<p class="note">${Menu.t.empty}</p>`}
        </div></section>
      ${cats.map((c, k) => { const ph = cover(c, s); return `
        <section class="slide">
          <div class="photo">${ph ? `<img src="${Menu.img(ph.img)}" alt="" loading="lazy">` : ""}<h2><small>${esc(Menu.title(s))} · ${k + 1}/${cats.length}</small>${esc(Menu.title(c))}</h2></div>
          <div class="list">${c.items.map((i) => `<button class="dish${i.img ? "" : " noimg"}" ${Menu.ref(i)}>${i.img ? `<img src="${Menu.img(i.img)}" alt="" loading="lazy">` : ""}
            <span><span class="n">${esc(Menu.name(i))}</span>${Menu.desc(i) ? `<span class="d">${esc(Menu.desc(i))}</span>` : ""}</span><span class="p">${Menu.price(i.price)}</span></button>`).join("")}
            ${k + 1 < cats.length ? `<p class="next">↑ ${esc(Menu.title(cats[k + 1]))}</p>` : ""}</div>
        </section>`; }).join("")}`;
    feed.scrollTop = 0;
    const slides = [...feed.children], dots = document.getElementById("dots");
    dots.innerHTML = "<i></i>".repeat(slides.length);
    observer?.disconnect();
    observer = new IntersectionObserver((es) => es.forEach((e) => {
      if (!e.isIntersecting) return;
      const k = slides.indexOf(e.target);
      [...dots.children].forEach((d, j) => d.classList.toggle("on", j <= k));
    }), { root: feed, threshold: .6 });
    slides.forEach((x) => observer.observe(x));
  },
});
document.addEventListener("click", (e) => { const b = e.target.closest("[data-slide]"); if (b) feed.children[+b.dataset.slide]?.scrollIntoView({ behavior: "smooth" }); });
</script>
</body>
</html>
