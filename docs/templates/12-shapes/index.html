<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shapes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 12 Shapes (no photos): Warm off-white, one soft arch in the header and every category in a white card. */

* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
.pad { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
svg { display: block; width: 100%; height: 100%; fill: currentColor; }
svg .ring { fill: none; stroke: currentColor; stroke-width: 22; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: max(14px, env(safe-area-inset-top)); padding-bottom: 14px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand b { font: 700 14px var(--body); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; display: grid; place-items: center; background: var(--soft-bg); font-weight: 700; font-size: 13px; flex: none; }
.lang { flex: none; min-width: 44px; height: 38px; padding: 0 12px; border: 1.5px solid currentColor; border-radius: 999px; background: none; font: 700 13px var(--body); cursor: pointer; }
.hero { position: relative; overflow: hidden; }
.hero > :not(.art) { position: relative; z-index: 1; }
.art { position: absolute; z-index: 0; right: -60px; top: 64px; width: 210px; height: 210px; color: var(--shape); pointer-events: none; }
.intro { padding-top: 64px; padding-bottom: 24px; }
.kicker { display: block; font: 700 11.5px var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
h1 { margin: 8px 0 0; font: var(--h1); letter-spacing: -.03em; }
.lede { margin: 10px 0 0; color: var(--mute); max-width: 34ch; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.meta span { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--soft-bg); }
.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--mute); }
.st.open::before { background: #2fae6a; }
.bar { position: sticky; top: 0; z-index: 5; background: var(--bar); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.secs { padding: 10px 0 6px; }
.secs button { flex: none; padding: 7px 14px; border: 0; border-radius: 999px; background: none; font: 700 14px var(--body); color: var(--mute); cursor: pointer; }
.secs button[aria-current="true"] { background: var(--ink); color: var(--bg); }
.cats { padding-bottom: 10px; }
.cats:empty { display: none; }
.cats button { flex: none; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: none; font: 600 13px var(--body); color: var(--ink); cursor: pointer; }
.cats button[aria-current="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.note { margin: 16px 0 0; padding: 14px 16px; border-radius: 14px; background: var(--soft-bg); white-space: pre-line; font-size: 14px; }
.cat { margin-top: 30px; scroll-margin-top: 110px; }
.ch { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; margin-bottom: 8px; }
.ch .num { font: 700 12px var(--body); letter-spacing: .1em; color: var(--mute); }
.ch h2 { margin: 0; font: var(--h2); letter-spacing: -.02em; min-width: 0; }
.ch .ct { font-size: 12px; font-weight: 700; color: var(--mute); }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 10px; width: 100%; padding: 13px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
.item .tx { min-width: 0; }
.item .n { display: block; font-weight: 700; font-size: 15.5px; line-height: 1.3; }
.item .d { display: block; margin-top: 2px; font-size: 13px; color: var(--mute); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.item .tags span { padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; font-size: 11px; font-weight: 700; }
.item .dots { display: none; }
.item .p { font: 700 15px var(--body); white-space: nowrap; font-variant-numeric: tabular-nums; }
.foot { margin-top: 44px; padding: 34px 0 calc(36px + env(safe-area-inset-bottom)); background: var(--foot); color: var(--foot-ink); }
.fart { display: flex; gap: 8px; }
.fart svg { width: 28px; height: 28px; }
.fname { display: block; margin-top: 18px; font: var(--h2); font-size: 30px; letter-spacing: -.02em; }
.hours { margin-top: 18px; display: grid; gap: 2px; font-size: 14px; }
.hours h3 { margin: 0 0 6px; font: 700 11.5px var(--body); letter-spacing: .16em; text-transform: uppercase; opacity: .6; }
.hours div { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--foot-line); opacity: .75; }
.hours .today { opacity: 1; font-weight: 700; }
.addr { margin: 18px 0 0; opacity: .75; font-size: 14px; }
.map { display: inline-block; margin-top: 14px; padding: 10px 18px; border-radius: 999px; background: var(--foot-ink); color: var(--foot); font-weight: 700; text-decoration: none; font-size: 14px; }
#m-sheet { margin: auto auto 0; width: 100%; max-width: 560px; padding: 0 0 env(safe-area-inset-bottom); border: 0; border-radius: 26px 26px 0 0; background: var(--bg); color: var(--ink); }
#m-sheet::backdrop { background: rgba(0,0,0,.45); }
.m-body { padding: 56px 24px 30px; }
.m-name { margin: 0; font: var(--h2); font-size: 30px; line-height: 1.1; }
.m-desc { margin: 10px 0 0; color: var(--mute); }
.m-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; align-items: center; }
.m-price { padding: 6px 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 17px; }
.m-badge { padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; font-weight: 700; }
.m-close { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--soft-bg); color: var(--ink); font-size: 22px; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
:root { --shape: #e3e0d9; }

:root { --bg: #f4f3ef; --ink: #1a1a1a; --mute: #74726c; --line: #e7e5df; --line2: #cfccc4; --soft-bg: #e9e7e1; --bar: rgba(244,243,239,.94); --foot: #1a1a1a; --foot-ink: #f4f3ef; --foot-line: rgba(255,255,255,.12);
  --body: "Figtree", system-ui, sans-serif; --h1: 800 clamp(40px, 12vw, 58px)/.95 "Bricolage Grotesque", sans-serif; --h2: 800 23px/1.1 "Bricolage Grotesque", sans-serif; }
.cat { position: relative; padding: 18px 16px 6px; border-radius: 24px; background: #fff; overflow: hidden; }
.ch { grid-template-columns: auto 1fr auto; }
.ch .num { grid-row: 1; }
.item:last-child { border-bottom: 0; }
/* Segmented control for sections, soft rounded-square chips. */
.lang { border: 0; border-radius: 12px; background: #fff; }
.meta span { border-radius: 10px; background: #fff; }
.secs { gap: 2px; margin-top: 10px; padding: 4px; border-radius: 14px; background: #e9e7e1; }
.secs button { padding: 8px 14px; border-radius: 10px; color: var(--mute); }
.secs button[aria-current="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.cats { padding-top: 8px; }
.cats button { border: 0; border-radius: 10px; background: #fff; }
.cats button[aria-current="true"] { background: var(--ink); }
.m-price { border-radius: 12px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../core.js"></script>
<script>
const { esc } = Menu;
const $app = document.getElementById("app");
// Geometric shapes, all drawn in currentColor on a 100x100 box.
const SH = [
  '<circle cx="50" cy="50" r="50"/>',
  '<path d="M0 100V50a50 50 0 0 1 100 0v50z"/>',
  '<path d="M0 0h100A100 100 0 0 1 0 100z"/>',
  '<path d="M50 0l50 100H0z"/>',
  '<path d="M0 0h100v100H0z" class="sq"/>',
  '<circle cx="50" cy="50" r="36" class="ring"/>',
  '<path d="M50 0l50 50-50 50L0 50z"/>',
  '<path d="M0 50a50 50 0 0 0 100 0z"/>',
].map((p) => `<svg viewBox="0 0 100 100" aria-hidden="true">${p}</svg>`);
const ART = [0, 2, 5, 1, 6, 3, 7, 4];
const pt = () => Menu.lang === "pt";
Menu.start({
  render() {
    const s = Menu.section, info = Menu.info, st = Menu.status(), cats = Menu.categories();
    const total = cats.reduce((n, c) => n + c.items.length, 0);
    document.title = info.name;
    $app.innerHTML = `
      <header class="hero">
        <div class="top pad"><span class="brand">${Menu.logo("logo")}<b>${esc(info.name)}</b></span><button class="lang" data-lang-toggle data-lang-label></button></div>
        <div class="art" aria-hidden="true">${SH[1]}</div>
        <div class="intro pad">
          <span class="kicker">${pt() ? "Menu" : "Menu"} · ${esc(Menu.title(s))}</span>
          <h1>${esc(info.name)}</h1>
          ${Menu.desc(s) ? `<p class="lede">${esc(Menu.desc(s))}</p>` : ""}
          <div class="meta"><span class="st${st.open ? " open" : ""}">${esc(st.text)}</span><span class="cnt">${total} ${pt() ? "opções" : "options"} · ${cats.length} ${pt() ? "categorias" : "categories"}</span></div>
        </div>
      </header>
      <i data-top></i>
      <div class="bar" data-sticky><div class="pad"><nav class="row secs">${Menu.sectionsNav()}</nav><nav class="row cats">${Menu.catsNav()}</nav></div></div>
      <main class="pad">
        ${Menu.tx(s, "info") ? `<p class="note">${esc(Menu.tx(s, "info"))}</p>` : ""}
        ${cats.map((c, k) => `<section class="cat" id="${Menu.catId(c)}">
          <div class="ch"><span class="num">${String(k + 1).padStart(2, "0")}</span><h2>${esc(Menu.title(c))}</h2><span class="ct">${c.items.length}</span></div>
          <div class="list">${c.items.map((i) => `<button class="item" ${Menu.ref(i)}><span class="tx"><span class="n">${esc(Menu.name(i))}</span>${Menu.desc(i) ? `<span class="d">${esc(Menu.desc(i))}</span>` : ""}${Menu.badges(i).length || i.volume ? `<span class="tags">${i.volume ? `<span>${esc(i.volume)}</span>` : ""}${Menu.badges(i).map((b) => `<span>${b.text}</span>`).join("")}</span>` : ""}</span><span class="dots"></span><span class="p">${Menu.price(i.price)}</span></button>`).join("")}</div>
        </section>`).join("") || `<p class="note">${Menu.t.empty}</p>`}
      </main>
      <footer class="foot"><div class="pad">
                <b class="fname">${esc(info.name)}</b>
        <div class="hours"><h3>${Menu.t.hours}</h3>${Menu.week().map((d) => `<div class="${d.today ? "today" : ""}"><span>${d.day}</span><span>${d.from}–${d.till}</span></div>`).join("")}</div>
        <p class="addr">${esc(info.address)}<br>${esc(info.phone)}</p>
        <a class="map" href="${info.maps}" target="_blank" rel="noopener">${Menu.t.map} →</a>
      </div></footer>`;
  },
  onItem(item) { Menu.sheet(Menu.detail({ ...item, img: null })); },
});
</script>
</body>
</html>
