<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noir</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 04 Noir: dark and elegant. Charcoal, warm gold accents, full-photo header, wide cards with the photo filling the left side. */
:root { --bg: #111111; --card: #1b1b1b; --card-2: #242424; --ink: #f4f1ea; --soft: #a19c92; --line: #2c2c2c; --gold: #d6aa5c; --gold-soft: rgba(214,170,92,.14); --display: "Sora", "Helvetica Neue", Arial, sans-serif; --body: "Figtree", system-ui, sans-serif; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
.pad { max-width: 660px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left)); padding-right: max(18px, env(safe-area-inset-right)); }
.hero { position: relative; min-height: 420px; display: flex; align-items: flex-end; overflow: hidden; }
.hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(17,17,17,.55) 0%, rgba(17,17,17,0) 30%, rgba(17,17,17,.2) 55%, var(--bg) 100%); }
.hero .top { position: absolute; z-index: 2; top: max(14px, env(safe-area-inset-top)); left: max(18px, env(safe-area-inset-left)); right: max(18px, env(safe-area-inset-right)); display: flex; justify-content: space-between; align-items: center; }
.st { padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 12.5px; font-weight: 500; }
.st::before { content: "● "; color: var(--soft); }
.st.open::before { color: #7fd69a; }
.lang { min-width: 42px; height: 42px; border: 1px solid rgba(214,170,92,.6); border-radius: 50%; background: rgba(0,0,0,.45); color: var(--gold); font: 600 12px var(--display); cursor: pointer; }
.hero .in { position: relative; z-index: 1; width: 100%; padding-top: 24px; padding-bottom: 18px; }
.eyebrow { font: 600 11px var(--display); letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
.hero h1 { margin: 10px 0 0; font: 700 clamp(44px, 13vw, 72px)/.95 var(--display); letter-spacing: -.04em; }
.hero h1 span { color: var(--gold); }
.bar { position: sticky; top: 0; z-index: 5; background: rgba(17,17,17,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.seg { padding: 12px 0 6px; }
.secs { gap: 2px; padding: 4px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
.secs button { flex: 1 0 auto; padding: 8px 14px; border: 0; border-radius: 999px; background: none; font: 600 13px var(--display); color: var(--soft); cursor: pointer; transition: background .2s, color .2s; }
.secs button[aria-current="true"] { background: var(--gold); color: #1a1406; }
.cats { gap: 20px; }
.cats:empty { display: none; }
.cats button { flex: none; padding: 6px 0 10px; border: 0; border-bottom: 2px solid transparent; background: none; font-size: 14px; color: var(--soft); cursor: pointer; }
.cats button[aria-current="true"] { color: var(--ink); border-color: var(--gold); }
.note { margin: 18px 0 0; padding: 16px 18px; border-radius: 16px; background: var(--card); white-space: pre-line; color: var(--soft); }
.picks { margin-top: 24px; }
.picks h2, .cat h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 14px; font: 700 24px/1.1 var(--display); letter-spacing: -.02em; }
.cat h2 small { margin-left: auto; font: 500 12px var(--body); color: var(--soft); }
.picks h2::before, .cat h2::before { content: ""; align-self: center; width: 18px; height: 2px; background: var(--gold); }
.rail { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; margin: 0 calc(-1 * max(18px, env(safe-area-inset-left))); padding: 0 max(18px, env(safe-area-inset-left)) 4px; scroll-padding: 0 max(18px, env(safe-area-inset-left)); }
.rail::-webkit-scrollbar { display: none; }
.pick { position: relative; flex: none; width: 72%; max-width: 290px; aspect-ratio: 4/5; scroll-snap-align: start; padding: 0; border: 0; border-radius: 22px; overflow: hidden; background: var(--card); text-align: left; cursor: pointer; }
.pick img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pick::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(0,0,0,.85)); }
.pick span { position: absolute; z-index: 1; left: 16px; right: 16px; bottom: 16px; }
.pick b { display: block; font: 600 18px/1.2 var(--display); letter-spacing: -.01em; }
.pick em { display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 999px; background: var(--gold); color: #1a1406; font: 600 13px var(--display); font-style: normal; }
.cat { margin-top: 32px; }
.list { display: grid; gap: 12px; }
.item { display: grid; grid-template-columns: 40% minmax(0, 1fr); width: 100%; min-height: 128px; padding: 0; border: 0; border-radius: 20px; background: var(--card); overflow: hidden; text-align: left; cursor: pointer; }
.item.noimg { grid-template-columns: minmax(0, 1fr); min-height: 0; }
.item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.item .tx { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; min-width: 0; }
.item .n { font: 600 16px/1.25 var(--display); letter-spacing: -.01em; }
.item .d { font-size: 13px; color: var(--soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .meta { margin-top: auto; padding-top: 6px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.item .p { font: 600 15px var(--display); color: var(--gold); font-variant-numeric: tabular-nums; }
.item .b { padding: 2px 8px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); font-size: 11px; font-weight: 600; }
footer { margin-top: 40px; padding: 22px 0 calc(30px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); text-align: center; color: var(--soft); font-size: 14px; display: grid; gap: 4px; }
footer b { font: 700 20px var(--display); color: var(--ink); }
footer a { color: var(--gold); }
#m-sheet { margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92vh; padding: 0 0 env(safe-area-inset-bottom); border: 0; border-radius: 26px 26px 0 0; background: var(--card); color: var(--ink); }
#m-sheet::backdrop { background: rgba(0,0,0,.7); }
.m-photo { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; }
.m-body { padding: 18px 22px 26px; }
.m-name { margin: 0; font: 700 26px/1.1 var(--display); letter-spacing: -.02em; }
.m-desc { margin: 8px 0 0; color: var(--soft); }
.m-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
.m-price { font: 700 22px var(--display); color: var(--gold); }
.m-badge { padding: 3px 10px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); font-size: 12px; font-weight: 600; }
.m-close { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 22px; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../core.js"></script>
<script>
const { esc } = Menu;
const $app = document.getElementById("app");
Menu.start({
  render() {
    const s = Menu.section, info = Menu.info, st = Menu.status(), picks = Menu.featured(s);
    document.title = info.name;
    const [a, ...b] = info.name.split(" & ");
    $app.innerHTML = `
      <header class="hero">${Menu.photos(s, 1).map((i) => `<img src="${Menu.img(i.img)}" alt="">`).join("")}
        <div class="top"><span class="st${st.open ? " open" : ""}">${esc(st.text)}</span><button class="lang" data-lang-toggle data-lang-label></button></div>
        <div class="pad in"><span class="eyebrow">${esc(Menu.desc(s) || Menu.title(s))}</span><h1>${b.length ? `${esc(a)} <span>&amp;</span> ${esc(b.join(" & "))}` : esc(info.name)}</h1></div></header>
      <i data-top></i>
      <div class="bar" data-sticky><div class="pad"><div class="seg"><nav class="row secs">${Menu.sectionsNav()}</nav></div><nav class="row cats">${Menu.catsNav()}</nav></div></div>
      <main class="pad">
        ${Menu.tx(s, "info") ? `<p class="note">${esc(Menu.tx(s, "info"))}</p>` : ""}
        ${picks.length > 1 ? `<section class="picks"><h2>${Menu.t.recommended}</h2><div class="rail">${picks.map((i) => `<button class="pick" ${Menu.ref(i)}><img src="${Menu.img(i.img)}" alt="" loading="lazy"><span><b>${esc(Menu.name(i))}</b><em>${Menu.price(i.price)}</em></span></button>`).join("")}</div></section>` : ""}
        ${Menu.categories().map((c) => `<section class="cat" id="${Menu.catId(c)}"><h2>${esc(Menu.title(c))}<small>${c.items.length}</small></h2><div class="list">
          ${c.items.map((i) => `<button class="item${i.img ? "" : " noimg"}" ${Menu.ref(i)}>
            ${i.img ? `<img src="${Menu.img(i.img)}" alt="" loading="lazy">` : ""}
            <span class="tx"><span class="n">${esc(Menu.name(i))}</span>${Menu.desc(i) ? `<span class="d">${esc(Menu.desc(i))}</span>` : ""}
              <span class="meta"><span class="p">${Menu.price(i.price)}</span>${i.volume ? `<span class="b">${esc(i.volume)}</span>` : ""}${Menu.badges(i).map((x) => `<span class="b">${x.text}</span>`).join("")}</span></span></button>`).join("")}
        </div></section>`).join("") || `<p class="note">${Menu.t.empty}</p>`}
        <footer><b>${esc(info.name)}</b><span>${esc(info.address)}</span><span>${esc(info.phone)} · <a href="${info.maps}" target="_blank" rel="noopener">${Menu.t.map}</a></span></footer>
      </main>`;
  },
});
</script>
</body>
</html>
