<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pastel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 12 Pastel (no photos): soft pastel card per category, each with its own colour and decorative shape. */
:root { --bg: #fffaf6; --ink: #2b2433; --soft: #776d80; --line: rgba(43,36,51,.1); --display: "Gloock", Georgia, serif; --body: "Plus Jakarta Sans", system-ui, sans-serif; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
.pad { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
.head { position: relative; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: 24px; text-align: center; overflow: hidden; }
.head::before, .head::after { content: ""; position: absolute; z-index: -1; border-radius: 50%; }
.head::before { width: 220px; height: 220px; left: -70px; top: -60px; background: #ffd9e4; }
.head::after { width: 160px; height: 160px; right: -40px; top: 60px; background: #d8ecff; }
.head .top { display: flex; justify-content: flex-end; }
.lang { min-width: 42px; height: 42px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 2px 10px rgba(43,36,51,.1); font: 700 13px var(--body); cursor: pointer; }
.badge { display: inline-grid; place-items: center; margin-top: 4px; padding: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 6px #fff1c9, 0 10px 26px -10px rgba(43,36,51,.3); }
.logo { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; display: grid; place-items: center; background: #fff1c9; font: 400 30px var(--display); }
.head h1 { margin: 18px 0 0; font: 400 clamp(40px, 12vw, 60px)/1 var(--display); }
.head p { margin: 6px 0 0; color: var(--soft); }
.st { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 6px 14px; border-radius: 999px; background: #fff; box-shadow: 0 1px 4px rgba(43,36,51,.08); font-size: 13px; font-weight: 600; }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #c7c0cc; }
.st.open::before { background: #4cc38a; }
.bar { position: sticky; top: 0; z-index: 5; background: rgba(255,250,246,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.secs { padding: 10px 0 6px; }
.secs button { flex: none; padding: 8px 15px; border: 0; border-radius: 999px; background: none; font: 600 14px var(--body); color: var(--soft); cursor: pointer; }
.secs button[aria-current="true"] { background: var(--ink); color: #fff; }
.cats { padding-bottom: 10px; }
.cats:empty { display: none; }
.cats button { flex: none; padding: 6px 13px; border: 0; border-radius: 999px; background: var(--c); font: 600 13px var(--body); cursor: pointer; opacity: .75; }
.cats button[aria-current="true"] { opacity: 1; box-shadow: inset 0 0 0 2px var(--ink); }
.note { margin: 14px 0 0; padding: 18px; border-radius: 24px; background: #fff1c9; white-space: pre-line; }
.card { position: relative; margin-top: 16px; padding: 22px 18px 10px; border-radius: 30px; background: var(--c); overflow: hidden; scroll-margin-top: 110px; }
.card .shape { position: absolute; right: -24px; top: -24px; width: 110px; height: 110px; opacity: .55; }
.card h2 { position: relative; margin: 0 0 8px; font: 400 32px/1.05 var(--display); }
.card h2 small { display: block; margin-bottom: 4px; font: 600 12px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; margin-bottom: 8px; padding: 13px 14px; border: 0; border-radius: 18px; background: rgba(255,255,255,.72); text-align: left; cursor: pointer; }
.item .n { display: block; font-weight: 700; font-size: 15.5px; line-height: 1.25; }
.item .d { display: block; margin-top: 2px; font-size: 13px; color: var(--soft); }
.item .tags { display: flex; gap: 6px; margin-top: 6px; }
.item .tags span { padding: 1px 8px; border-radius: 999px; background: var(--c); font-size: 11px; font-weight: 700; }
.item .p { padding: 6px 11px; border-radius: 14px; background: #fff; font: 700 14px var(--body); white-space: nowrap; font-variant-numeric: tabular-nums; }
footer { margin-top: 30px; padding-block: 24px calc(32px + env(safe-area-inset-bottom)); text-align: center; color: var(--soft); font-size: 14px; }
footer b { display: block; font: 400 26px var(--display); color: var(--ink); }
footer a { color: var(--ink); font-weight: 700; }
#m-sheet { margin: auto auto 0; width: 100%; max-width: 560px; padding: 0 0 env(safe-area-inset-bottom); border: 0; border-radius: 30px 30px 0 0; background: var(--bg); color: var(--ink); }
#m-sheet::backdrop { background: rgba(43,36,51,.35); }
.m-body { padding: 56px 24px 30px; text-align: center; }
.m-name { margin: 0; font: 400 32px/1.05 var(--display); }
.m-desc { margin: 10px 0 0; color: var(--soft); }
.m-meta { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 16px; align-items: center; }
.m-price { padding: 6px 16px; border-radius: 999px; background: #ffd9e4; font-weight: 700; font-size: 17px; }
.m-badge { padding: 4px 10px; border-radius: 999px; background: #d8ecff; font-size: 12px; font-weight: 700; }
.m-close { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: #fff; font-size: 22px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../core.js"></script>
<script>
const { esc } = Menu;
const $app = document.getElementById("app");
const COLORS = ["#ffe1ea", "#dcecff", "#e3f6dc", "#fff1c9", "#ece3ff", "#ffe6d6"];
// Decorative shapes, one per category in turn: flower, star, circles, arch.
const SHAPES = [
  '<svg viewBox="0 0 100 100"><g fill="#fff">' + [0, 60, 120, 180, 240, 300].map((a) => `<ellipse cx="50" cy="26" rx="14" ry="24" transform="rotate(${a} 50 50)"/>`).join("") + '<circle cx="50" cy="50" r="12"/></g></svg>',
  '<svg viewBox="0 0 100 100"><path fill="#fff" d="M50 4l12 30 32 4-24 21 7 32-27-16-27 16 7-32L6 38l32-4z"/></svg>',
  '<svg viewBox="0 0 100 100"><g fill="none" stroke="#fff" stroke-width="9"><circle cx="50" cy="50" r="40"/><circle cx="50" cy="50" r="20"/></g></svg>',
  '<svg viewBox="0 0 100 100"><path fill="#fff" d="M10 100V50a40 40 0 0 1 80 0v50z"/></svg>',
];
const col = (k) => COLORS[k % COLORS.length];
Menu.start({
  render() {
    const s = Menu.section, info = Menu.info, st = Menu.status(), cats = Menu.categories();
    document.title = info.name;
    $app.innerHTML = `
      <header class="pad head"><div class="top"><button class="lang" data-lang-toggle data-lang-label></button></div>
        <span class="badge">${Menu.logo("logo")}</span><h1>${esc(info.name)}</h1>${Menu.desc(s) ? `<p>${esc(Menu.desc(s))}</p>` : ""}
        <span class="st${st.open ? " open" : ""}">${esc(st.text)}</span></header>
      <i data-top></i>
      <div class="bar" data-sticky><div class="pad"><nav class="row secs">${Menu.sectionsNav()}</nav>
        <nav class="row cats">${cats.length > 1 ? cats.map((c, k) => `<button data-cat="${Menu.catId(c)}" style="--c:${col(k)}">${esc(Menu.title(c))}</button>`).join("") : ""}</nav></div></div>
      <main class="pad">
        ${Menu.tx(s, "info") ? `<p class="note">${esc(Menu.tx(s, "info"))}</p>` : ""}
        ${cats.map((c, k) => `<section class="card" id="${Menu.catId(c)}" style="--c:${col(k)}"><span class="shape" aria-hidden="true">${SHAPES[k % SHAPES.length]}</span>
          <h2><small>${c.items.length} ${Menu.lang === "pt" ? "opções" : "options"}</small>${esc(Menu.title(c))}</h2>
          ${c.items.map((i) => `<button class="item" ${Menu.ref(i)}><span><span class="n">${esc(Menu.name(i))}</span>${Menu.desc(i) ? `<span class="d">${esc(Menu.desc(i))}</span>` : ""}
            ${Menu.badges(i).length || i.volume ? `<span class="tags">${i.volume ? `<span>${esc(i.volume)}</span>` : ""}${Menu.badges(i).map((b) => `<span>${b.text}</span>`).join("")}</span>` : ""}</span>
            <span class="p">${Menu.price(i.price)}</span></button>`).join("")}</section>`).join("") || `<p class="note">${Menu.t.empty}</p>`}
        <footer><b>${esc(info.name)}</b>${esc(info.address)}<br>${esc(info.phone)} · <a href="${info.maps}" target="_blank" rel="noopener">${Menu.t.map}</a></footer>
      </main>`;
  },
  onItem(item) { Menu.sheet(Menu.detail({ ...item, img: null })); },
});
</script>
</body>
</html>
