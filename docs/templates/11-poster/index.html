<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet">
<style>
/* 11 Poster (no photos): every category is a full-width colour band with huge type; dishes sit on the band. */
:root { --paper: #f6f3ec; --ink: #121212; --display: "Archivo", "Arial Black", sans-serif; --narrow: "Archivo Narrow", "Arial Narrow", sans-serif; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--display); -webkit-font-smoothing: antialiased; }
.pad { max-width: 680px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left)); padding-right: max(18px, env(safe-area-inset-right)); }
.head { padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: 22px; }
.head .top { display: flex; justify-content: space-between; align-items: center; }
.logo { width: 58px; height: 58px; border-radius: 50%; object-fit: cover; display: grid; place-items: center; background: var(--ink); color: var(--paper); font: 900 18px var(--display); box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--ink); }
.lang { min-width: 44px; height: 44px; border: 2.5px solid var(--ink); border-radius: 50%; background: none; font: 900 13px var(--display); cursor: pointer; }
.head h1 { margin: 22px 0 0; font: 900 clamp(60px, 19vw, 118px)/.82 var(--display); letter-spacing: -.055em; text-transform: uppercase; }
.head .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.head .meta span { padding: 6px 12px; border-radius: 999px; background: var(--ink); color: var(--paper); font: 700 12px var(--narrow); letter-spacing: .06em; text-transform: uppercase; }
.head .meta .open { background: #1f9d55; }
.bar { position: sticky; top: 0; z-index: 5; background: var(--paper); border-block: 2.5px solid var(--ink); }
.row { display: flex; overflow-x: auto; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.secs button { flex: none; padding: 11px 14px; border: 0; border-right: 2.5px solid var(--ink); background: none; font: 900 14px var(--display); text-transform: uppercase; cursor: pointer; }
.secs button[aria-current="true"] { background: var(--ink); color: var(--paper); }
.cats { gap: 6px; padding: 8px max(18px, env(safe-area-inset-left)); border-top: 2.5px solid var(--ink); }
.cats:empty { display: none; }
.cats button { flex: none; display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 6px; border: 0; border-radius: 999px; background: none; font: 700 13px var(--narrow); text-transform: uppercase; letter-spacing: .04em; cursor: pointer; }
.cats button::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 2px var(--ink); }
.cats button[aria-current="true"] { background: var(--ink); color: var(--paper); }
.note { margin: 0; padding: 20px max(18px, env(safe-area-inset-left)); background: var(--ink); color: var(--paper); white-space: pre-line; }
.band { position: relative; overflow: hidden; background: var(--c); color: var(--t); padding-block: 26px 30px; }
.band::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; border: 26px solid currentColor; opacity: .1; }
.band h2 { position: relative; margin: 0 0 14px; font: 900 clamp(46px, 14vw, 84px)/.85 var(--display); letter-spacing: -.05em; text-transform: uppercase; overflow-wrap: anywhere; }
.band h2 small { display: block; margin-bottom: 8px; font: 700 13px var(--narrow); letter-spacing: .12em; }
.item { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: start; width: 100%; padding: 14px 0; border: 0; border-top: 2px solid currentColor; background: none; text-align: left; cursor: pointer; color: inherit; }
.item .n { display: block; font: 900 19px/1.15 var(--display); letter-spacing: -.02em; }
.item .d { display: block; margin-top: 3px; font: 600 14px/1.35 var(--narrow); opacity: .8; }
.item .tags { display: flex; gap: 6px; margin-top: 6px; }
.item .tags span { padding: 2px 8px; border: 1.5px solid currentColor; border-radius: 999px; font: 700 11px var(--narrow); text-transform: uppercase; letter-spacing: .06em; }
.item .p { padding: 6px 12px; border-radius: 999px; background: var(--t); color: var(--c); font: 900 15px var(--display); white-space: nowrap; font-variant-numeric: tabular-nums; }
footer { padding-block: 26px calc(34px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--paper); font: 600 14px var(--narrow); }
footer .pad { display: grid; gap: 4px; }
footer b { font: 900 30px var(--display); letter-spacing: -.04em; text-transform: uppercase; }
footer a { color: #ff7ac6; }
#m-sheet { margin: auto auto 0; width: 100%; max-width: 560px; padding: 0 0 env(safe-area-inset-bottom); border: 0; border-top: 3px solid var(--ink); background: var(--paper); color: var(--ink); }
#m-sheet::backdrop { background: rgba(0,0,0,.5); }
.m-body { padding: 54px 22px 28px; }
.m-name { margin: 0; font: 900 34px/.95 var(--display); letter-spacing: -.04em; text-transform: uppercase; }
.m-desc { margin: 10px 0 0; font: 600 16px var(--narrow); }
.m-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; align-items: center; }
.m-price { padding: 6px 14px; border-radius: 999px; background: var(--ink); color: var(--paper); font-weight: 900; }
.m-badge { padding: 3px 10px; border: 2px solid var(--ink); border-radius: 999px; font: 700 12px var(--narrow); text-transform: uppercase; }
.m-close { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border: 2.5px solid var(--ink); border-radius: 50%; background: none; font-size: 22px; cursor: pointer; }
button:focus-visible { outline: 3px solid #2347d6; outline-offset: 2px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../core.js"></script>
<script>
const { esc } = Menu;
const $app = document.getElementById("app");
// Band colours and the text colour that reads on each.
const BANDS = [["#ff5a36", "#121212"], ["#2347d6", "#ffffff"], ["#c6f432", "#121212"], ["#ff7ac6", "#121212"], ["#121212", "#f6f3ec"], ["#ffc93c", "#121212"]];
const band = (k) => BANDS[k % BANDS.length];
Menu.start({
  render() {
    const s = Menu.section, info = Menu.info, st = Menu.status(), cats = Menu.categories(), today = Menu.week().find((d) => d.today);
    document.title = info.name;
    $app.innerHTML = `
      <header class="pad head"><div class="top">${Menu.logo("logo")}<button class="lang" data-lang-toggle data-lang-label></button></div>
        <h1>${esc(info.name)}</h1>
        <div class="meta"><span class="${st.open ? "open" : ""}">${esc(st.text)}</span><span>${today.from}–${today.till}</span>${Menu.desc(s) ? `<span>${esc(Menu.desc(s))}</span>` : ""}</div></header>
      <i data-top></i>
      <div class="bar" data-sticky><nav class="row secs">${Menu.sectionsNav()}</nav>
        <nav class="row cats">${cats.length > 1 ? cats.map((c, k) => `<button data-cat="${Menu.catId(c)}" style="--c:${band(k)[0]}">${esc(Menu.title(c))}</button>`).join("") : ""}</nav></div>
      ${Menu.tx(s, "info") ? `<p class="note">${esc(Menu.tx(s, "info"))}</p>` : ""}
      ${cats.map((c, k) => `<section class="band" id="${Menu.catId(c)}" style="--c:${band(k)[0]};--t:${band(k)[1]}"><div class="pad">
        <h2><small>${String(k + 1).padStart(2, "0")} — ${c.items.length}</small>${esc(Menu.title(c))}</h2>
        ${c.items.map((i) => `<button class="item" ${Menu.ref(i)}><span><span class="n">${esc(Menu.name(i))}</span>${Menu.desc(i) ? `<span class="d">${esc(Menu.desc(i))}</span>` : ""}
          ${Menu.badges(i).length || i.volume ? `<span class="tags">${i.volume ? `<span>${esc(i.volume)}</span>` : ""}${Menu.badges(i).map((b) => `<span>${b.text}</span>`).join("")}</span>` : ""}</span>
          <span class="p">${Menu.price(i.price)}</span></button>`).join("")}</div></section>`).join("") || `<p class="note">${Menu.t.empty}</p>`}
      <footer><div class="pad"><b>${esc(info.name)}</b><div>${esc(info.address)}</div><div>${esc(info.phone)} · <a href="${info.maps}" target="_blank" rel="noopener">${Menu.t.map}</a></div></div></footer>`;
  },
  onItem(item) { Menu.sheet(Menu.detail({ ...item, img: null })); },
});
</script>
</body>
</html>
