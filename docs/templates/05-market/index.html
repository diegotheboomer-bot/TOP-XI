<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@600;700;800&family=Albert+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 05 Market: fresh and light. Sage background, stacked round photos in the header, staggered two-column photo cards. */
:root { --bg: #eef1e7; --card: #ffffff; --ink: #1d2a1b; --soft: #66715f; --line: #dde3d2; --green: #2f6b3a; --green-soft: #dcead7; --tomato: #e4572e; --display: "Urbanist", "Helvetica Neue", Arial, sans-serif; --body: "Albert Sans", system-ui, sans-serif; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
.pad { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
.hero { padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: 20px; }
.top { display: flex; justify-content: space-between; align-items: center; }
.st { padding: 5px 12px; border-radius: 999px; background: var(--card); font-size: 12.5px; font-weight: 600; color: var(--soft); }
.st.open { background: var(--green-soft); color: var(--green); }
.lang { min-width: 42px; height: 42px; border: 0; border-radius: 50%; background: var(--ink); color: #fff; font: 700 13px var(--display); cursor: pointer; }
.title { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; margin-top: 20px; }
.title h1 { margin: 0; font: 800 clamp(42px, 12.5vw, 66px)/.92 var(--display); letter-spacing: -.035em; }
.title h1 span { color: var(--green); }
.title p { margin: 8px 0 0; color: var(--soft); font-weight: 500; }
.stack { display: flex; }
.stack img { width: 66px; height: 66px; border-radius: 50%; object-fit: cover; border: 3px solid var(--bg); margin-left: -22px; }
.stack img:first-child { margin-left: 0; }
.bar { position: sticky; top: 0; z-index: 5; background: rgba(238,241,231,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.tabbar { margin-top: 8px; padding: 4px; border-radius: 16px; background: var(--card); box-shadow: 0 1px 2px rgba(29,42,27,.06); }
.secs { gap: 2px; }
.secs button { flex: 1 0 auto; padding: 9px 14px; border: 0; border-radius: 12px; background: none; font: 700 14px var(--display); color: var(--soft); cursor: pointer; }
.secs button[aria-current="true"] { background: var(--green-soft); color: var(--green); }
.cats { gap: 20px; padding: 10px 2px 8px; }
.cats:empty { display: none; }
.cats button { flex: none; padding: 2px 0 6px; border: 0; border-bottom: 2.5px solid transparent; background: none; font: 700 15px var(--display); color: var(--soft); cursor: pointer; }
.cats button[aria-current="true"] { color: var(--ink); border-color: var(--green); }
.note { margin: 16px 0 0; padding: 16px 18px; border-radius: 18px; background: var(--card); white-space: pre-line; }
.cat { margin-top: 26px; }
.cat h2 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 12px; font: 800 26px/1.05 var(--display); letter-spacing: -.02em; }
.cat h2 small { padding: 2px 8px; border-radius: 999px; background: var(--green-soft); color: var(--green); font: 700 12px var(--body); }
.masonry { columns: 2; column-gap: 10px; }
@media (min-width: 640px) { .masonry { columns: 3; } }
.card { display: inline-block; width: 100%; margin: 0 0 10px; padding: 0; border: 0; border-radius: 20px; background: var(--card); overflow: hidden; text-align: left; cursor: pointer; break-inside: avoid; }
.card img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
.card.tall img { aspect-ratio: 4/5; }
.card .tx { display: grid; gap: 4px; padding: 10px 12px 12px; }
.card .n { font: 700 15px/1.2 var(--display); }
.card .d { font-size: 12.5px; color: var(--soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 2px; }
.card .p { font: 800 15px var(--display); color: var(--tomato); font-variant-numeric: tabular-nums; }
.card .b { padding: 1px 7px; border-radius: 999px; background: var(--green-soft); color: var(--green); font-size: 10.5px; font-weight: 600; }
.card.text { background: var(--green-soft); }
.card.text .tx { padding: 14px; }
footer { margin-top: 36px; padding: 22px 0 calc(30px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); text-align: center; color: var(--soft); font-size: 14px; display: grid; gap: 4px; }
footer b { font: 800 22px var(--display); color: var(--ink); }
footer a { color: var(--green); font-weight: 600; }
#m-sheet { margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92vh; padding: 0 0 env(safe-area-inset-bottom); border: 0; border-radius: 26px 26px 0 0; background: var(--card); color: var(--ink); }
#m-sheet::backdrop { background: rgba(29,42,27,.45); }
.m-photo { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; }
.m-body { padding: 18px 22px 26px; }
.m-name { margin: 0; font: 800 26px/1.1 var(--display); letter-spacing: -.02em; }
.m-desc { margin: 8px 0 0; color: var(--soft); }
.m-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
.m-price { font: 800 22px var(--display); color: var(--tomato); }
.m-badge { padding: 3px 10px; border-radius: 999px; background: var(--green-soft); color: var(--green); font-size: 12px; font-weight: 600; }
.m-close { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: #fff; color: var(--ink); font-size: 22px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
button:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../core.js"></script>
<script>
const { esc } = Menu;
const $app = document.getElementById("app");
const card = (i, k) => `<button class="card${i.img ? (k % 3 === 0 ? " tall" : "") : " text"}" ${Menu.ref(i)}>
  ${i.img ? `<img src="${Menu.img(i.img)}" alt="" loading="lazy">` : ""}
  <span class="tx"><span class="n">${esc(Menu.name(i))}</span>${Menu.desc(i) ? `<span class="d">${esc(Menu.desc(i))}</span>` : ""}
    <span class="meta"><span class="p">${Menu.price(i.price)}</span>${i.volume ? `<span class="b">${esc(i.volume)}</span>` : ""}${Menu.badges(i).map((x) => `<span class="b">${x.text}</span>`).join("")}</span></span></button>`;
Menu.start({
  render() {
    const s = Menu.section, info = Menu.info, st = Menu.status();
    document.title = info.name;
    const [a, ...b] = info.name.split(" & ");
    $app.innerHTML = `
      <header class="pad hero"><div class="top"><span class="st${st.open ? " open" : ""}">${esc(st.text)}</span><button class="lang" data-lang-toggle data-lang-label></button></div>
        <div class="title"><div><h1>${b.length ? `${esc(a)} <span>&amp;</span> ${esc(b.join(" & "))}` : esc(info.name)}</h1>${Menu.desc(s) ? `<p>${esc(Menu.desc(s))}</p>` : ""}</div>
          <div class="stack" aria-hidden="true">${Menu.photos(s, 3).map((i) => `<img src="${Menu.img(i.img)}" alt="">`).join("")}</div></div></header>
      <i data-top></i>
      <div class="bar" data-sticky><div class="pad"><div class="tabbar"><nav class="row secs">${Menu.sectionsNav()}</nav></div><nav class="row cats">${Menu.catsNav()}</nav></div></div>
      <main class="pad">
        ${Menu.tx(s, "info") ? `<p class="note">${esc(Menu.tx(s, "info"))}</p>` : ""}
        ${Menu.categories().map((c) => `<section class="cat" id="${Menu.catId(c)}"><h2>${esc(Menu.title(c))}<small>${c.items.length}</small></h2><div class="masonry">${c.items.map(card).join("")}</div></section>`).join("") || `<p class="note">${Menu.t.empty}</p>`}
        <footer><b>${esc(info.name)}</b><span>${esc(info.address)}</span><span>${esc(info.phone)} · <a href="${info.maps}" target="_blank" rel="noopener">${Menu.t.map}</a></span></footer>
      </main>`;
  },
});
</script>
</body>
</html>
