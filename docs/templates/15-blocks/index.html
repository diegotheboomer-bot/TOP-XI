<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 15 Blocks (no photos): every dish is a coloured tile; the first of each category is a big wide tile. */
:root { --bg: #f7f4ef; --ink: #1f1b16; --soft: #6f675e; --display: "DM Serif Display", Georgia, serif; --body: "Work Sans", system-ui, sans-serif; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
.pad { max-width: 680px; margin: 0 auto; padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
.head { padding-top: max(14px, env(safe-area-inset-top)); padding-bottom: 16px; }
.hgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.hgrid > * { border-radius: 22px; padding: 14px; min-width: 0; }
.h-name { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 12px; align-items: flex-end; min-height: 150px; background: var(--ink); color: var(--bg); }
.h-name h1 { margin: 0; font: 400 clamp(42px, 12.5vw, 66px)/.92 var(--display); }
.h-name h1 em { color: #ff8a5b; }
.h-side { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 12px; align-self: stretch; }
.logo { width: 62px; height: 62px; border-radius: 50%; object-fit: cover; display: grid; place-items: center; background: #ffc94a; color: var(--ink); font: 400 20px var(--display); }
.lang { min-width: 40px; height: 40px; border: 0; border-radius: 12px; background: var(--bg); color: var(--ink); font: 700 12px var(--body); cursor: pointer; }
.h-st { background: #c9e4c5; } .h-hr { background: #ffd8c2; }
.hgrid small { display: block; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: rgba(31,27,22,.6); }
.hgrid b { display: block; margin-top: 18px; font: 400 20px/1.1 var(--display); }
.bar { position: sticky; top: 0; z-index: 5; background: rgba(247,244,239,.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.secs { padding: 10px 0 6px; }
.secs button { flex: none; padding: 10px 14px; border: 0; border-radius: 14px; background: #ebe5dc; font: 600 14px var(--body); cursor: pointer; }
.secs button[aria-current="true"] { background: var(--ink); color: var(--bg); }
.cats { padding-bottom: 10px; gap: 14px; }
.cats:empty { display: none; }
.cats button { flex: none; display: flex; align-items: center; gap: 6px; padding: 3px 0; border: 0; background: none; font: 500 14px var(--body); color: var(--soft); cursor: pointer; }
.cats button::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.cats button[aria-current="true"] { color: var(--ink); font-weight: 700; }
.note { margin: 12px 0 0; padding: 16px; border-radius: 20px; background: #ffd8c2; white-space: pre-line; }
.cat { margin-top: 26px; }
.cat h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; font: 400 30px/1 var(--display); }
.cat h2 small { font: 600 12px var(--body); color: var(--soft); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 620px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile { position: relative; display: flex; flex-direction: column; gap: 6px; min-height: 150px; min-width: 0; padding: 14px; border: 0; border-radius: 22px; background: var(--c); text-align: left; cursor: pointer; overflow: hidden; }
.tile::after { content: ""; position: absolute; right: -26px; bottom: -26px; width: 84px; height: 84px; border-radius: 50%; background: rgba(255,255,255,.28); }
.tile:nth-child(3n)::after { border-radius: 18px; transform: rotate(20deg); }
.tile .n { position: relative; font: 400 19px/1.1 var(--display); }
.tile .d { position: relative; font-size: 12.5px; color: rgba(31,27,22,.72); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tile .tags { position: relative; display: flex; flex-wrap: wrap; gap: 5px; }
.tile .tags span { padding: 1px 8px; border-radius: 999px; background: rgba(255,255,255,.6); font-size: 10.5px; font-weight: 700; }
.tile .p { position: relative; z-index: 1; margin-top: auto; align-self: flex-start; padding: 5px 11px; border-radius: 999px; background: var(--ink); color: var(--bg); font: 700 13.5px var(--body); font-variant-numeric: tabular-nums; }
.tile.big { grid-column: span 2; min-height: 170px; }
.tile.big .n { font-size: 28px; }
.tile.big .d { font-size: 14px; max-width: 80%; }
footer { margin-top: 30px; padding-block: 0 calc(30px + env(safe-area-inset-bottom)); }
footer .fc { padding: 18px; border-radius: 22px; background: var(--ink); color: var(--bg); font-size: 14px; }
footer b { display: block; font: 400 26px var(--display); }
footer a { color: #ffc94a; }
#m-sheet { margin: auto auto 0; width: 100%; max-width: 560px; padding: 0 0 env(safe-area-inset-bottom); border: 0; border-radius: 28px 28px 0 0; background: var(--bg); color: var(--ink); }
#m-sheet::backdrop { background: rgba(31,27,22,.45); }
.m-body { padding: 56px 22px 28px; }
.m-name { margin: 0; font: 400 34px/1.05 var(--display); }
.m-desc { margin: 10px 0 0; color: var(--soft); }
.m-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; align-items: center; }
.m-price { padding: 6px 14px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 700; }
.m-badge { padding: 3px 10px; border-radius: 999px; background: #c9e4c5; font-size: 12px; font-weight: 700; }
.m-close { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border: 0; border-radius: 12px; background: #ebe5dc; font-size: 22px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../core.js"></script>
<script>
const { esc } = Menu;
const $app = document.getElementById("app");
const COLORS = ["#ffb38a", "#ffd76a", "#bfe0b5", "#cdbdf0", "#a9d5f2", "#f7b8c9"];
const col = (n) => COLORS[n % COLORS.length];
const L = () => Menu.lang === "pt" ? { st: "Agora", hr: "Hoje" } : { st: "Now", hr: "Today" };
Menu.start({
  render() {
    const s = Menu.section, info = Menu.info, st = Menu.status(), cats = Menu.categories(), today = Menu.week().find((d) => d.today), l = L();
    const [a, ...b] = info.name.split(" & ");
    document.title = info.name;
    let n = 0;
    $app.innerHTML = `
      <header class="pad head"><div class="hgrid">
        <div class="h-name"><h1>${b.length ? `${esc(a)} <em>&amp;</em> ${esc(b.join(" & "))}` : esc(info.name)}</h1><div class="h-side">${Menu.logo("logo")}<button class="lang" data-lang-toggle data-lang-label></button></div></div>
        <div class="h-st"><small>${l.st}</small><b>${esc(st.text)}</b></div>
        <div class="h-hr"><small>${l.hr}</small><b>${today.from}–${today.till}</b></div>
      </div></header>
      <i data-top></i>
      <div class="bar" data-sticky><div class="pad"><nav class="row secs">${Menu.sectionsNav()}</nav>
        <nav class="row cats">${cats.length > 1 ? cats.map((c, k) => `<button data-cat="${Menu.catId(c)}" style="--c:${col(k)}">${esc(Menu.title(c))}</button>`).join("") : ""}</nav></div></div>
      <main class="pad">
        ${Menu.tx(s, "info") ? `<p class="note">${esc(Menu.tx(s, "info"))}</p>` : ""}
        ${cats.map((c, k) => `<section class="cat" id="${Menu.catId(c)}"><h2>${esc(Menu.title(c))}<small>${c.items.length}</small></h2><div class="tiles">
          ${c.items.map((i, j) => `<button class="tile${j === 0 && c.items.length > 1 ? " big" : ""}" style="--c:${col(n++)}" ${Menu.ref(i)}>
            <span class="n">${esc(Menu.name(i))}</span>${Menu.desc(i) ? `<span class="d">${esc(Menu.desc(i))}</span>` : ""}
            ${Menu.badges(i).length || i.volume ? `<span class="tags">${i.volume ? `<span>${esc(i.volume)}</span>` : ""}${Menu.badges(i).map((x) => `<span>${x.text}</span>`).join("")}</span>` : ""}
            <span class="p">${Menu.price(i.price)}</span></button>`).join("")}</div></section>`).join("") || `<p class="note">${Menu.t.empty}</p>`}
        <footer><div class="fc"><b>${esc(info.name)}</b>${esc(info.address)}<br>${esc(info.phone)} · <a href="${info.maps}" target="_blank" rel="noopener">${Menu.t.map}</a></div></footer>
      </main>`;
  },
  onItem(item) { Menu.sheet(Menu.detail({ ...item, img: null })); },
});
</script>
</body>
</html>
