<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swiss</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 09 Swiss: bento grid. Black on white with one blue, a big lead tile per category, square tiles after it. */
:root { --paper: #f4f4f2; --tile: #ffffff; --ink: #0b0b0b; --soft: #6f6f6f; --hair: #dedede; --blue: #1f3cff; --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
.pad { max-width: 720px; margin: 0 auto; padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
/* Header bento: name tile, two photo tiles, and fact tiles. */
.head { padding-top: max(14px, env(safe-area-inset-top)); }
.hb { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-areas: "name name" "ph st" "ph hr" "tel ph2"; gap: 8px; }
@media (min-width: 620px) { .hb { grid-template-columns: 2fr 1fr 1fr; grid-template-areas: "name ph st" "name ph hr" "tel ph ph2"; } }
.ht { position: relative; min-width: 0; border-radius: 18px; background: var(--tile); overflow: hidden; }
.ht.name { grid-area: name; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; padding: 16px 16px 18px; background: var(--ink); color: #fff; }
.ht.name .top { display: flex; justify-content: space-between; align-items: center; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: #9a9a9a; }
.head h1 { margin: 0; font: 700 clamp(44px, 14vw, 78px)/.88 var(--sans); letter-spacing: -.05em; overflow-wrap: anywhere; }
.head h1 span { color: #6f84ff; }
.lang { flex: none; min-width: 40px; height: 40px; border: 0; border-radius: 10px; background: #fff; color: var(--ink); font: 500 12px var(--mono); cursor: pointer; }
.ht.ph { grid-area: ph; min-height: 190px; padding: 0; border: 0; cursor: pointer; }
.ht.ph2 { grid-area: ph2; min-height: 96px; padding: 0; border: 0; cursor: pointer; }
.ht.ph img, .ht.ph2 img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ht.st { grid-area: st; } .ht.hr { grid-area: hr; }
.ht.tel { grid-area: tel; background: var(--blue); color: #fff; }
.ht.st, .ht.hr, .ht.tel { padding: 12px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
.ht small { font: 500 10px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--soft); }
.ht.tel small { color: rgba(255,255,255,.7); }
.ht b { font: 700 16px/1.15 var(--sans); letter-spacing: -.01em; overflow-wrap: anywhere; }
.ht.st.open b { color: var(--blue); }
.bar { position: sticky; top: 0; z-index: 5; margin-top: 16px; background: rgba(244,244,242,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--hair); }
.nrow { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.nrow::-webkit-scrollbar { display: none; }
.navline { display: flex; align-items: center; gap: 14px; padding-top: 10px; padding-bottom: 10px; }
.secbtn { flex: none; padding: 8px 12px; border: 0; border-radius: 10px; background: var(--ink); color: #fff; font: 700 14px var(--sans); cursor: pointer; }
.secbtn span { color: #6f84ff; }
.cats { flex: 1; min-width: 0; gap: 16px; padding-left: 2px; }
.cats:empty { display: none; }
.cats button { flex: none; display: flex; gap: 5px; align-items: baseline; padding: 4px 0; border: 0; background: none; font-size: 13.5px; color: var(--soft); cursor: pointer; }
.cats button i { font: 400 10.5px var(--mono); font-style: normal; }
.cats button[aria-current="true"] { color: var(--blue); font-weight: 700; }
.note { margin: 16px 0 0; padding: 16px; border-radius: 14px; background: var(--tile); white-space: pre-line; font-size: 14px; }
.cat { margin-top: 28px; }
.cat h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; font: 700 26px var(--sans); letter-spacing: -.03em; }
.cat h2 i { font: 400 12px var(--mono); font-style: normal; color: var(--blue); }
.cat h2 small { margin-left: auto; font: 400 12px var(--mono); color: var(--soft); }
.bento { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 620px) { .bento { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile { position: relative; display: flex; flex-direction: column; padding: 0; border: 0; border-radius: 16px; background: var(--tile); overflow: hidden; text-align: left; cursor: pointer; min-width: 0; }
.tile img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
.tile .tx { display: grid; gap: 2px; padding: 10px 12px 12px; }
.tile .n { font-weight: 700; font-size: 14px; line-height: 1.25; letter-spacing: -.01em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile .p { font: 500 13px var(--mono); color: var(--blue); }
.tile .b { position: absolute; top: 8px; left: 8px; padding: 3px 7px; border-radius: 6px; background: var(--ink); color: #fff; font: 500 10px var(--mono); text-transform: uppercase; }
.tile.lead { grid-column: span 2; }
.tile.lead img { aspect-ratio: 16/10; }
.tile.lead .tx { padding: 14px 16px 16px; }
.tile.lead .n { font-size: 20px; letter-spacing: -.02em; }
.tile.lead .d { display: block; font-size: 13px; color: var(--soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile.text { justify-content: space-between; min-height: 92px; }
.tile.sold img { filter: grayscale(1); opacity: .55; }
.tile.sold .n { color: var(--soft); }
footer { margin-top: 36px; padding: 18px 0 calc(28px + env(safe-area-inset-bottom)); border-top: 2px solid var(--ink); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; }
footer small { display: block; font: 500 10px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--soft); }
footer a { color: var(--blue); }
#m-sheet { margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92vh; padding: 0 0 env(safe-area-inset-bottom); border: 0; border-radius: 22px 22px 0 0; background: var(--tile); color: var(--ink); }
#m-sheet::backdrop { background: rgba(0,0,0,.45); }
.m-photo { display: block; width: 100%; aspect-ratio: 16/11; object-fit: cover; }
.m-body { padding: 16px 20px 24px; }
.m-name { margin: 0; font: 700 26px/1.1 var(--sans); letter-spacing: -.03em; }
.m-desc { margin: 8px 0 0; color: var(--soft); }
.m-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
.m-price { font: 500 20px var(--mono); color: var(--blue); }
.m-badge { padding: 3px 8px; border-radius: 6px; background: var(--paper); font: 500 11px var(--mono); text-transform: uppercase; }
.m-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 64px 16px 24px; }
.m-picker button { display: flex; flex-direction: column; align-items: flex-start; gap: 18px; padding: 14px; border: 0; border-radius: 16px; background: var(--paper); cursor: pointer; text-align: left; }
.m-picker b { font: 700 19px var(--sans); letter-spacing: -.02em; }
.m-picker span { font: 400 12px var(--mono); color: var(--soft); }
.m-picker [aria-current="true"] { background: var(--ink); color: #fff; }
.m-picker [aria-current="true"] span { color: #6f84ff; }
.m-close { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border: 0; border-radius: 10px; background: var(--ink); color: #fff; font-size: 20px; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../core.js"></script>
<script>
const { esc } = Menu;
const $app = document.getElementById("app");
const pad = (n) => String(n).padStart(2, "0");
const L = () => Menu.lang === "pt" ? { today: "Hoje", status: "Estado", phone: "Telefone", where: "Onde" } : { today: "Today", status: "Status", phone: "Phone", where: "Where" };
const tile = (i, lead) => {
  const b = Menu.badges(i)[0], desc = Menu.desc(i);
  return `<button class="tile${lead ? " lead" : ""}${i.img ? "" : " text"}${i.soldOut ? " sold" : ""}" ${Menu.ref(i)}>
    ${i.img ? `<img src="${Menu.img(i.img)}" alt="" loading="lazy">` : ""}${b ? `<span class="b">${b.text}</span>` : ""}
    <span class="tx"><span class="n">${esc(Menu.name(i))}</span>${lead && desc ? `<span class="d">${esc(desc)}</span>` : ""}<span class="p">${Menu.price(i.price)}${i.volume ? ` · ${esc(i.volume)}` : ""}</span></span></button>`;
};
Menu.start({
  render() {
    const s = Menu.section, info = Menu.info, st = Menu.status(), today = Menu.week().find((d) => d.today), l = L(), cats = Menu.categories();
    const [ph1, ph2] = Menu.photos(s, 2);
    document.title = info.name;
    const [a, ...b] = info.name.split(" & ");
    $app.innerHTML = `
      <header class="pad head"><div class="hb">
        <div class="ht name"><div class="top"><span>${esc(Menu.desc(s) || Menu.title(s))}</span><button class="lang" data-lang-toggle data-lang-label></button></div><h1>${b.length ? `${esc(a)} <span>&amp;</span> ${esc(b.join(" & "))}` : esc(info.name)}</h1></div>
        ${[ph1, ph2].map((i, k) => i ? `<button class="ht ${k ? "ph2" : "ph"}" ${Menu.ref(i)} aria-label="${esc(Menu.name(i))}"><img src="${Menu.img(i.img)}" alt=""></button>` : `<div class="ht ${k ? "ph2" : "ph"}"></div>`).join("")}
        <div class="ht st${st.open ? " open" : ""}"><small>${l.status}</small><b>${esc(st.text)}</b></div>
        <div class="ht hr"><small>${l.today}</small><b>${today.from}–${today.till}</b></div>
        <div class="ht tel"><small>${l.phone}</small><b>${esc(info.phone)}</b></div>
      </div></header>
      <i data-top></i>
      <div class="bar" data-sticky><div class="pad navline">${Menu.sectionPicker("secbtn")}
        ${cats.length > 1 ? `<nav class="nrow cats">${cats.map((c, k) => `<button data-cat="${Menu.catId(c)}"><i>${pad(k + 1)}</i>${esc(Menu.title(c))}</button>`).join("")}</nav>` : ""}</div></div>
      <main class="pad">
        ${Menu.tx(s, "info") ? `<p class="note">${esc(Menu.tx(s, "info"))}</p>` : ""}
        ${cats.map((c, k) => {
          const lead = c.items.find((i) => i.img && !i.soldOut);
          return `<section class="cat" id="${Menu.catId(c)}"><h2><i>${pad(k + 1)}</i>${esc(Menu.title(c))}<small>${c.items.length}</small></h2>
            <div class="bento">${lead ? tile(lead, true) : ""}${c.items.filter((i) => i !== lead).map((i) => tile(i, false)).join("")}</div></section>`;
        }).join("") || `<p class="note">${Menu.t.empty}</p>`}
        <footer><div><small>${l.where}</small>${esc(info.address)}</div><div><small>${l.phone}</small>${esc(info.phone)}<br><a href="${info.maps}" target="_blank" rel="noopener">${Menu.t.map}</a></div></footer>
      </main>`;
  },
});
</script>
</body>
</html>
