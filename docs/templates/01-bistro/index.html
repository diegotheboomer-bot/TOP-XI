<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bistro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 01 Bistro: a printed card. Centred serif masthead, dotted leaders, small photos on the right. */
:root { --paper: #f6f4ee; --ink: #1d3a2f; --soft: #66746b; --brass: #9c7a33; --rule: #d9d3c2; --serif: "Cormorant Garamond", Georgia, serif; --sans: "Jost", system-ui, sans-serif; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
.pad { max-width: 620px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); }
.top { display: flex; justify-content: space-between; align-items: center; padding-top: max(16px, env(safe-area-inset-top)); font: 500 12px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
.top button { min-height: 36px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 18px; background: none; font: 500 12px var(--sans); letter-spacing: .1em; color: var(--ink); cursor: pointer; }
.mast { text-align: center; padding: 22px 0 20px; }
.mast h1 { margin: 0; font: 600 clamp(42px, 12vw, 64px)/.95 var(--serif); }
.mast h1 i { color: var(--brass); font-weight: 500; }
.mast p { margin: 8px 0 0; font: italic 500 18px var(--serif); color: var(--soft); }
.bar { position: sticky; top: 0; z-index: 5; background: var(--paper); border-block: 1px solid var(--rule); }
.row { display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.secs button { flex: none; padding: 12px 0 10px; border: 0; background: none; font: 500 13px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--soft); cursor: pointer; border-bottom: 2px solid transparent; }
.secs button[aria-current="true"] { color: var(--ink); border-color: var(--brass); }
.cats { border-top: 1px solid var(--rule); gap: 18px; }
.cats:empty { display: none; }
.cats button { flex: none; padding: 9px 0; border: 0; background: none; font: italic 500 17px var(--serif); color: var(--soft); cursor: pointer; }
.cats button[aria-current="true"] { color: var(--ink); font-weight: 600; }
.note { margin: 24px 0 0; font: italic 500 18px/1.45 var(--serif); text-align: center; white-space: pre-line; color: var(--soft); }
main { padding-bottom: 20px; }
.cat { margin-top: 34px; }
.cat h2 { display: flex; align-items: center; gap: 14px; margin: 0 0 8px; font: 600 26px var(--serif); }
.cat h2::before, .cat h2::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: start; width: 100%; padding: 14px 0; border: 0; border-bottom: 1px dotted var(--rule); background: none; text-align: left; cursor: pointer; }
.item:last-child { border-bottom: 0; }
.line { display: flex; align-items: baseline; gap: 8px; }
.line .n { font: 600 20px/1.2 var(--serif); }
.line .dots { flex: 1; min-width: 12px; border-bottom: 1.5px dotted var(--rule); transform: translateY(-5px); }
.line .p { font: 600 19px var(--serif); font-variant-numeric: tabular-nums; white-space: nowrap; }
.item .d { display: block; margin-top: 3px; font: italic 500 16px/1.35 var(--serif); color: var(--soft); }
.item .tag { display: inline-block; margin-top: 6px; font: 500 11px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--brass); }
.item img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; }
.item.sold .n, .item.sold .p { color: var(--soft); text-decoration: line-through; }
.item.sold img { filter: grayscale(1); opacity: .6; }
footer { margin-top: 30px; padding: 22px 0 calc(32px + env(safe-area-inset-bottom)); border-top: 1px solid var(--rule); text-align: center; font-size: 14px; color: var(--soft); display: grid; gap: 4px; }
footer b { font: 600 20px var(--serif); color: var(--ink); }
footer a { color: var(--brass); }
#m-sheet { width: min(460px, calc(100% - 32px)); padding: 0; border: 0; border-radius: 6px; background: var(--paper); color: var(--ink); }
#m-sheet::backdrop { background: rgba(29, 58, 47, .45); }
.m-photo { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; }
.m-body { padding: 20px 24px 26px; text-align: center; }
.m-name { margin: 0; font: 600 28px/1.1 var(--serif); }
.m-desc { margin: 8px 0 0; font: italic 500 18px/1.4 var(--serif); color: var(--soft); }
.m-meta { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
.m-price { font: 600 22px var(--serif); }
.m-badge { font: 500 11px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--brass); }
.m-close { position: absolute; top: 10px; right: 10px; width: 38px; height: 38px; border: 0; border-radius: 50%; background: var(--paper); color: var(--ink); font-size: 22px; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../core.js"></script>
<script>
const { esc } = Menu;
const $app = document.getElementById("app");
const nameHtml = (n) => { const [a, ...b] = n.split(" & "); return b.length ? `${esc(a)} <i>&amp;</i> ${esc(b.join(" & "))}` : esc(n); };
Menu.start({
  render() {
    const s = Menu.section, info = Menu.info, st = Menu.status();
    document.title = info.name;
    $app.innerHTML = `
      <div class="pad top"><span>${esc(st.text)}</span><button data-lang-toggle data-lang-label></button></div>
      <header class="pad mast"><h1>${nameHtml(info.name)}</h1>${Menu.desc(s) ? `<p>${esc(Menu.desc(s))}</p>` : ""}</header>
      <i data-top></i>
      <div class="bar" data-sticky><div class="pad"><nav class="row secs">${Menu.sectionsNav()}</nav></div><div class="pad"><nav class="row cats">${Menu.catsNav()}</nav></div></div>
      <main class="pad">
        ${Menu.tx(s, "info") ? `<p class="note">${esc(Menu.tx(s, "info"))}</p>` : ""}
        ${Menu.categories().map((c) => `<section class="cat" id="${Menu.catId(c)}"><h2>${esc(Menu.title(c))}</h2>
          ${c.items.map((i) => `<button class="item${i.soldOut ? " sold" : ""}" ${Menu.ref(i)}><span>
            <span class="line"><span class="n">${esc(Menu.name(i))}</span><span class="dots"></span><span class="p">${Menu.price(i.price)}</span></span>
            ${Menu.desc(i) ? `<span class="d">${esc(Menu.desc(i))}</span>` : ""}
            ${Menu.badges(i).length ? `<span class="tag">${Menu.badges(i).map((b) => b.text).join(" · ")}</span>` : ""}</span>
            ${i.img ? `<img src="${Menu.img(i.img)}" alt="" loading="lazy">` : ""}</button>`).join("")}</section>`).join("") || `<p class="note">${Menu.t.empty}</p>`}
        <footer><b>${esc(info.name)}</b><span>${esc(info.address)}</span><span>${esc(info.phone)} · <a href="${info.maps}" target="_blank" rel="noopener">${Menu.t.map}</a></span></footer>
      </main>`;
  },
});
</script>
</body>
</html>
