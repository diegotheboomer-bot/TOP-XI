<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bistro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 01 Bistro: refined and warm. Photo cover, serif names, soft ivory cards, brass accents. */
:root { --paper: #f5f2ea; --card: #fffdf8; --ink: #1c3329; --soft: #6b766f; --brass: #a37f35; --line: #e6dfcf; --serif: "Cormorant Garamond", Georgia, serif; --sans: "Jost", system-ui, sans-serif; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
.pad { max-width: 640px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left)); padding-right: max(18px, env(safe-area-inset-right)); }
.cover { position: relative; min-height: 340px; display: flex; align-items: flex-end; color: #fff; background: var(--ink); overflow: hidden; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,30,25,.45) 0%, rgba(20,30,25,0) 35%, rgba(20,30,25,.85) 100%); }
.cover .in { position: relative; z-index: 1; width: 100%; padding-top: 26px; padding-bottom: 26px; }
.cover .top { position: absolute; z-index: 2; top: max(14px, env(safe-area-inset-top)); left: max(18px, env(safe-area-inset-left)); right: max(18px, env(safe-area-inset-right)); display: flex; justify-content: space-between; align-items: center; }
.chip { padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.18); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font: 500 12.5px var(--sans); }
.chip.open::before { content: "● "; color: #8fe0a8; }
.lang { min-width: 42px; height: 42px; border: 0; border-radius: 50%; background: rgba(255,255,255,.92); color: var(--ink); font: 600 13px var(--sans); cursor: pointer; }
.cover h1 { margin: 0; font: 600 clamp(46px, 13vw, 70px)/.95 var(--serif); }
.cover h1 i { color: #e2c27d; font-weight: 500; }
.cover p { margin: 6px 0 0; font: italic 500 19px var(--serif); opacity: .9; }
.bar { position: sticky; top: 0; z-index: 5; background: rgba(245,242,234,.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.secs { padding: 12px 0 8px; }
.secs button { flex: none; padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font: 500 14px var(--sans); cursor: pointer; }
.secs button[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.cats { gap: 20px; }
.cats:empty { display: none; }
.cats button { flex: none; padding: 6px 0 10px; border: 0; border-bottom: 2px solid transparent; background: none; font: italic 600 17px var(--serif); color: var(--soft); cursor: pointer; }
.cats button[aria-current="true"] { color: var(--ink); border-color: var(--brass); }
.note { margin: 18px 0 0; padding: 18px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); font: italic 500 17px/1.45 var(--serif); white-space: pre-line; }
.picks { margin-top: 24px; }
.picks h3, .cat h2 { margin: 0 0 12px; font: 600 28px/1.1 var(--serif); }
.picks h3 small, .cat h2 small { margin-left: 8px; font: 500 13px var(--sans); color: var(--soft); }
.rail { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; margin: 0 calc(-1 * max(18px, env(safe-area-inset-left))); padding: 0 max(18px, env(safe-area-inset-left)) 4px; scroll-padding: 0 max(18px, env(safe-area-inset-left)); }
.rail::-webkit-scrollbar { display: none; }
.pick { flex: none; width: 70%; max-width: 280px; scroll-snap-align: start; padding: 0; border: 0; border-radius: 20px; overflow: hidden; background: var(--card); box-shadow: 0 1px 0 var(--line); text-align: left; cursor: pointer; }
.pick img { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; }
.pick span { display: block; padding: 12px 14px 14px; }
.pick b { display: block; font: 600 20px/1.15 var(--serif); }
.pick em { font-style: normal; color: var(--brass); font-weight: 600; }
.cat { margin-top: 30px; }
.list { display: grid; gap: 10px; }
.item { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: center; width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); text-align: left; cursor: pointer; }
.item.noimg { grid-template-columns: minmax(0, 1fr); padding: 14px 16px; }
.item img { width: 96px; height: 96px; border-radius: 13px; object-fit: cover; }
.item .n { display: block; font: 600 20px/1.15 var(--serif); }
.item .d { display: block; margin-top: 2px; font-size: 13.5px; color: var(--soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
.item .p { font-weight: 600; color: var(--brass); font-variant-numeric: tabular-nums; }
.item .b { font: 500 10.5px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
.item.sold img { filter: grayscale(1); opacity: .6; }
.item.sold .n { color: var(--soft); }
footer { margin-top: 36px; padding: 22px 0 calc(30px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); text-align: center; font-size: 14px; color: var(--soft); display: grid; gap: 4px; }
footer b { font: 600 22px var(--serif); color: var(--ink); }
footer a { color: var(--brass); }
#m-sheet { margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92vh; padding: 0 0 env(safe-area-inset-bottom); border: 0; border-radius: 24px 24px 0 0; background: var(--card); color: var(--ink); }
#m-sheet::backdrop { background: rgba(28, 51, 41, .45); }
.m-photo { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; }
.m-body { padding: 18px 22px 26px; }
.m-name { margin: 0; font: 600 30px/1.05 var(--serif); }
.m-desc { margin: 8px 0 0; color: var(--soft); }
.m-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
.m-price { font: 600 24px var(--serif); color: var(--brass); }
.m-badge { font: 500 11px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
.m-close { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(255,255,255,.92); color: var(--ink); font-size: 22px; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../core.js"></script>
<script>
const { esc } = Menu;
const $app = document.getElementById("app");
const nameHtml = (n) => { const [a, ...b] = n.split(" & "); return b.length ? `${esc(a)} <i>&amp;</i> ${esc(b.join(" & "))}` : esc(n); };
const coverOf = (s) => Menu.featured(s)[0] || s.categories.flatMap((c) => c.items).find((i) => i.img) || Menu.data.sections.flatMap((x) => x.categories.flatMap((c) => c.items)).find((i) => i.img);
Menu.start({
  render() {
    const s = Menu.section, info = Menu.info, st = Menu.status(), cover = coverOf(s), picks = Menu.featured(s);
    document.title = info.name;
    $app.innerHTML = `
      <header class="cover">${cover ? `<img src="${Menu.img(cover.img)}" alt="">` : ""}
        <div class="top"><span class="chip${st.open ? " open" : ""}">${esc(st.text)}</span><button class="lang" data-lang-toggle data-lang-label></button></div>
        <div class="pad in"><h1>${nameHtml(info.name)}</h1>${Menu.desc(s) ? `<p>${esc(Menu.desc(s))}</p>` : ""}</div></header>
      <i data-top></i>
      <div class="bar" data-sticky><div class="pad"><nav class="row secs">${Menu.sectionsNav()}</nav><nav class="row cats">${Menu.catsNav()}</nav></div></div>
      <main class="pad">
        ${Menu.tx(s, "info") ? `<p class="note">${esc(Menu.tx(s, "info"))}</p>` : ""}
        ${picks.length > 1 ? `<section class="picks"><h3>${Menu.t.recommended}</h3><div class="rail">${picks.map((i) => `<button class="pick" ${Menu.ref(i)}><img src="${Menu.img(i.img)}" alt="" loading="lazy"><span><b>${esc(Menu.name(i))}</b><em>${Menu.price(i.price)}</em></span></button>`).join("")}</div></section>` : ""}
        ${Menu.categories().map((c) => `<section class="cat" id="${Menu.catId(c)}"><h2>${esc(Menu.title(c))}<small>${c.items.length}</small></h2><div class="list">
          ${c.items.map((i) => `<button class="item${i.img ? "" : " noimg"}${i.soldOut ? " sold" : ""}" ${Menu.ref(i)}>
            ${i.img ? `<img src="${Menu.img(i.img)}" alt="" loading="lazy">` : ""}
            <span><span class="n">${esc(Menu.name(i))}</span>${Menu.desc(i) ? `<span class="d">${esc(Menu.desc(i))}</span>` : ""}
              <span class="meta"><span class="p">${Menu.price(i.price)}</span>${i.volume ? `<span class="b">${esc(i.volume)}</span>` : ""}${Menu.badges(i).map((b) => `<span class="b">${b.text}</span>`).join("")}</span></span></button>`).join("")}
        </div></section>`).join("") || `<p class="note">${Menu.t.empty}</p>`}
        <footer><b>${esc(info.name)}</b><span>${esc(info.address)}</span><span>${esc(info.phone)} · <a href="${info.maps}" target="_blank" rel="noopener">${Menu.t.map}</a></span></footer>
      </main>`;
  },
});
</script>
</body>
</html>
