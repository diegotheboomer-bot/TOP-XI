<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chalkboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 05 Chalkboard: café blackboard. Chalk lettering for headings and prices only, plain text for dishes. */
:root { --board: #1f2925; --board-2: #25302b; --chalk: #f1efe6; --dim: #a9afa6; --line: rgba(241,239,230,.16); --yellow: #f2d06b; --pink: #f3a9b5; --hand: "Caveat", "Comic Sans MS", cursive; --body: "Work Sans", system-ui, sans-serif; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
body { margin: 0; background: var(--board); color: var(--chalk); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
.pad { max-width: 640px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); }
.hero { padding-top: max(18px, env(safe-area-inset-top)); padding-bottom: 18px; background: radial-gradient(120% 90% at 50% 0%, var(--board-2), var(--board) 75%); text-align: center; }
.top { display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 13px; }
.top button { min-height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 17px; background: none; font: 600 13px var(--body); color: var(--yellow); cursor: pointer; }
h1 { margin: 16px 0 0; font: 700 clamp(56px, 17vw, 92px)/.9 var(--hand); }
h1 em { font-style: normal; color: var(--pink); }
.sub { margin: 4px 0 0; color: var(--yellow); font: 600 24px var(--hand); }
.bar { position: sticky; top: 0; z-index: 5; background: var(--board); border-block: 1px solid var(--line); }
.row { display: flex; gap: 18px; overflow-x: auto; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.secs button { flex: none; padding: 8px 0 4px; border: 0; background: none; font: 700 24px var(--hand); color: var(--dim); cursor: pointer; }
.secs button[aria-current="true"] { color: var(--chalk); text-decoration: underline; text-decoration-color: var(--yellow); text-decoration-thickness: 2px; text-underline-offset: 6px; }
.cats { gap: 8px; padding-bottom: 10px; }
.cats:empty { display: none; }
.cats button { flex: none; padding: 5px 11px; border: 1px dashed var(--line); border-radius: 14px; background: none; font: 500 13px var(--body); color: var(--dim); cursor: pointer; }
.cats button[aria-current="true"] { border-style: solid; border-color: var(--yellow); color: var(--yellow); }
.note { margin: 20px 0 0; white-space: pre-line; color: var(--dim); text-align: center; }
.cat { margin-top: 30px; }
.cat h2 { margin: 0 0 4px; font: 700 36px/1 var(--hand); color: var(--yellow); }
.it { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: baseline; width: 100%; padding: 13px 0; border: 0; border-bottom: 1px dashed var(--line); background: none; text-align: left; cursor: pointer; }
.it .n { display: block; font-weight: 600; font-size: 16px; }
.it .d { display: block; margin-top: 2px; color: var(--dim); font-size: 13.5px; }
.it .x { display: inline-block; margin-left: 8px; font: 700 18px var(--hand); color: var(--pink); }
.it .p { font: 700 24px var(--hand); white-space: nowrap; }
.it.sold .n, .it.sold .p { color: var(--dim); text-decoration: line-through; }
footer { margin-top: 36px; padding: 20px 0 calc(32px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); text-align: center; color: var(--dim); font-size: 14px; display: grid; gap: 2px; }
footer b { font: 700 30px var(--hand); color: var(--chalk); }
footer a { color: var(--yellow); }
#m-sheet { width: min(380px, calc(100% - 40px)); padding: 12px 12px 18px; border: 0; border-radius: 4px; background: #fbfaf5; color: #2a2a2a; }
#m-sheet::backdrop { background: rgba(0,0,0,.6); }
.m-photo { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
.m-body { padding: 12px 4px 0; text-align: center; }
.m-name { margin: 0; font: 700 32px/1 var(--hand); }
.m-desc { margin: 6px 0 0; font-size: 14px; color: #555; }
.m-meta { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 10px; align-items: center; }
.m-price { font: 700 28px var(--hand); color: #b23a2e; }
.m-badge { font: 600 12px var(--body); color: #555; text-transform: uppercase; letter-spacing: .06em; }
.m-close { position: absolute; top: 18px; right: 18px; width: 38px; height: 38px; border: 0; border-radius: 50%; background: rgba(255,255,255,.9); color: #2a2a2a; font-size: 22px; cursor: pointer; }
button:focus-visible { outline: 2px dashed var(--yellow); outline-offset: 3px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../core.js"></script>
<script>
const { esc } = Menu;
const $app = document.getElementById("app");
Menu.start({
  render() {
    const s = Menu.section, info = Menu.info, st = Menu.status();
    document.title = info.name;
    const [a, ...b] = info.name.split(" & ");
    $app.innerHTML = `
      <header class="hero"><div class="pad"><div class="top"><span>${esc(st.text)}</span><button data-lang-toggle data-lang-label></button></div>
        <h1>${b.length ? `${esc(a)} <em>&amp;</em> ${esc(b.join(" & "))}` : esc(info.name)}</h1>${Menu.desc(s) ? `<p class="sub">${esc(Menu.desc(s))}</p>` : ""}</div></header>
      <i data-top></i>
      <div class="bar" data-sticky><div class="pad"><nav class="row secs">${Menu.sectionsNav()}</nav><nav class="row cats">${Menu.catsNav()}</nav></div></div>
      <main class="pad">
        ${Menu.tx(s, "info") ? `<p class="note">${esc(Menu.tx(s, "info"))}</p>` : ""}
        ${Menu.categories().map((c) => `<section class="cat" id="${Menu.catId(c)}"><h2>${esc(Menu.title(c))}</h2>
          ${c.items.map((i) => `<button class="it${i.soldOut ? " sold" : ""}" ${Menu.ref(i)}>
            <span><span class="n">${esc(Menu.name(i))}${i.labels.includes("new") ? `<span class="x">${Menu.t.new}!</span>` : ""}${i.soldOut ? `<span class="x">${Menu.t.soldOut}</span>` : ""}</span>
            ${Menu.desc(i) ? `<span class="d">${esc(Menu.desc(i))}</span>` : ""}</span>
            <span class="p">${Menu.price(i.price).replace(/\s?€/, "€")}</span></button>`).join("")}</section>`).join("") || `<p class="note">${Menu.t.empty}</p>`}
        <footer><b>${esc(info.name)}</b><span>${esc(info.address)}</span><span>${esc(info.phone)} · <a href="${info.maps}" target="_blank" rel="noopener">${Menu.t.map}</a></span></footer>
      </main>`;
  },
});
</script>
</body>
</html>
