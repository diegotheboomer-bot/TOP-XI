<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chalkboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 05 Chalkboard: modern café. Deep board green, chalk lettering for headings and prices, photo cards. */
:root { --board: #1d2723; --card: #27332e; --card-2: #2e3b35; --chalk: #f3f1e8; --dim: #a8b0a8; --line: rgba(243,241,232,.12); --yellow: #f2d06b; --pink: #f3a9b5; --hand: "Caveat", "Comic Sans MS", cursive; --body: "Work Sans", system-ui, sans-serif; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
body { margin: 0; background: var(--board); color: var(--chalk); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
.pad { max-width: 640px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left)); padding-right: max(18px, env(safe-area-inset-right)); }
.hero { padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: 20px; background: radial-gradient(110% 80% at 50% 0%, #2a3631, var(--board) 75%); }
.top { display: flex; justify-content: space-between; align-items: center; }
.st { padding: 5px 12px; border-radius: 999px; background: var(--card); color: var(--dim); font-size: 12.5px; }
.st.open { color: #9fe0b4; }
.lang { min-width: 42px; height: 42px; border: 0; border-radius: 50%; background: var(--yellow); color: #2a2a2a; font: 600 13px var(--body); cursor: pointer; }
h1 { margin: 18px 0 0; font: 700 clamp(56px, 17vw, 90px)/.9 var(--hand); }
h1 em { font-style: normal; color: var(--pink); }
.sub { margin: 4px 0 0; color: var(--yellow); font: 600 24px var(--hand); }
.bar { position: sticky; top: 0; z-index: 5; background: rgba(29,39,35,.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.secs { padding: 10px 0 8px; }
.secs button { flex: none; padding: 7px 15px; border: 0; border-radius: 999px; background: var(--card); font: 500 14px var(--body); color: var(--dim); cursor: pointer; }
.secs button[aria-current="true"] { background: var(--chalk); color: var(--board); }
.cats { gap: 18px; }
.cats:empty { display: none; }
.cats button { flex: none; padding: 2px 0 8px; border: 0; background: none; font: 700 21px var(--hand); color: var(--dim); cursor: pointer; }
.cats button[aria-current="true"] { color: var(--yellow); }
.note { margin: 18px 0 0; padding: 16px 18px; border-radius: 16px; background: var(--card); white-space: pre-line; color: var(--dim); }
.picks { margin-top: 22px; }
.picks h3, .cat h2 { margin: 0 0 10px; font: 700 34px/1 var(--hand); color: var(--yellow); }
.rail { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; margin: 0 calc(-1 * max(18px, env(safe-area-inset-left))); padding: 0 max(18px, env(safe-area-inset-left)) 4px; scroll-padding: 0 max(18px, env(safe-area-inset-left)); }
.rail::-webkit-scrollbar { display: none; }
.pick { position: relative; flex: none; width: 62%; max-width: 250px; aspect-ratio: 4/5; scroll-snap-align: start; padding: 0; border: 0; border-radius: 20px; overflow: hidden; background: var(--card); text-align: left; cursor: pointer; }
.pick img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pick::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(0,0,0,.8)); }
.pick span { position: absolute; z-index: 1; left: 14px; right: 14px; bottom: 12px; }
.pick b { display: block; font-weight: 600; font-size: 16px; line-height: 1.25; }
.pick em { font: 700 22px var(--hand); font-style: normal; color: var(--yellow); }
.cat { margin-top: 28px; }
.list { display: grid; gap: 10px; }
.it { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 14px; align-items: center; width: 100%; padding: 10px 14px 10px 10px; border: 0; border-radius: 18px; background: var(--card); text-align: left; cursor: pointer; }
.it.noimg { grid-template-columns: minmax(0, 1fr) auto; padding: 14px 16px; }
.it img { width: 76px; height: 76px; border-radius: 14px; object-fit: cover; }
.it .n { display: block; font-weight: 600; font-size: 15.5px; line-height: 1.3; }
.it .d { display: block; margin-top: 2px; color: var(--dim); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.it .x { display: inline-block; margin-top: 4px; padding: 1px 8px; border-radius: 999px; background: var(--card-2); font-size: 11px; font-weight: 600; color: var(--pink); }
.it .p { font: 700 24px var(--hand); white-space: nowrap; }
.it.sold img { filter: grayscale(1); opacity: .5; }
.it.sold .n, .it.sold .p { color: var(--dim); }
footer { margin-top: 34px; padding: 20px 0 calc(30px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); text-align: center; color: var(--dim); font-size: 14px; display: grid; gap: 2px; }
footer b { font: 700 30px var(--hand); color: var(--chalk); }
footer a { color: var(--yellow); }
#m-sheet { margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92vh; padding: 0 0 env(safe-area-inset-bottom); border: 0; border-radius: 26px 26px 0 0; background: var(--card); color: var(--chalk); }
#m-sheet::backdrop { background: rgba(0,0,0,.6); }
.m-photo { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; }
.m-body { padding: 16px 20px 26px; }
.m-name { margin: 0; font: 700 34px/1 var(--hand); color: var(--yellow); }
.m-desc { margin: 8px 0 0; color: var(--dim); }
.m-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; align-items: center; }
.m-price { font: 700 30px var(--hand); }
.m-badge { padding: 2px 9px; border-radius: 999px; background: var(--card-2); font-size: 12px; font-weight: 600; color: var(--pink); }
.m-close { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: 22px; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../core.js"></script>
<script>
const { esc } = Menu;
const $app = document.getElementById("app");
Menu.start({
  render() {
    const s = Menu.section, info = Menu.info, st = Menu.status(), picks = Menu.featured(s);
    document.title = info.name;
    const [a, ...b] = info.name.split(" & ");
    $app.innerHTML = `
      <header class="hero"><div class="pad"><div class="top"><span class="st${st.open ? " open" : ""}">${esc(st.text)}</span><button class="lang" data-lang-toggle data-lang-label></button></div>
        <h1>${b.length ? `${esc(a)} <em>&amp;</em> ${esc(b.join(" & "))}` : esc(info.name)}</h1>${Menu.desc(s) ? `<p class="sub">${esc(Menu.desc(s))}</p>` : ""}</div></header>
      <i data-top></i>
      <div class="bar" data-sticky><div class="pad"><nav class="row secs">${Menu.sectionsNav()}</nav><nav class="row cats">${Menu.catsNav()}</nav></div></div>
      <main class="pad">
        ${Menu.tx(s, "info") ? `<p class="note">${esc(Menu.tx(s, "info"))}</p>` : ""}
        ${picks.length > 1 ? `<section class="picks"><h3>${Menu.t.recommended}</h3><div class="rail">${picks.map((i) => `<button class="pick" ${Menu.ref(i)}><img src="${Menu.img(i.img)}" alt="" loading="lazy"><span><b>${esc(Menu.name(i))}</b><em>${Menu.price(i.price).replace(/\s?€/, "€")}</em></span></button>`).join("")}</div></section>` : ""}
        ${Menu.categories().map((c) => `<section class="cat" id="${Menu.catId(c)}"><h2>${esc(Menu.title(c))}</h2><div class="list">
          ${c.items.map((i) => `<button class="it${i.img ? "" : " noimg"}${i.soldOut ? " sold" : ""}" ${Menu.ref(i)}>
            ${i.img ? `<img src="${Menu.img(i.img)}" alt="" loading="lazy">` : ""}
            <span><span class="n">${esc(Menu.name(i))}</span>${Menu.desc(i) ? `<span class="d">${esc(Menu.desc(i))}</span>` : ""}${Menu.badges(i).map((x) => `<span class="x">${x.text}</span> `).join("")}</span>
            <span class="p">${Menu.price(i.price).replace(/\s?€/, "€")}</span></button>`).join("")}
        </div></section>`).join("") || `<p class="note">${Menu.t.empty}</p>`}
        <footer><b>${esc(info.name)}</b><span>${esc(info.address)}</span><span>${esc(info.phone)} · <a href="${info.maps}" target="_blank" rel="noopener">${Menu.t.map}</a></span></footer>
      </main>`;
  },
});
</script>
</body>
</html>
